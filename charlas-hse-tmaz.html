  --text:#EAF3EC; --muted:#A8BFB0; --green:#0E3B24; --green-2:#2E9E62; --green-tint:#183A27;
  --red:#FF5A70; --red-tint:#3A1720; --focus:#FF5A70;
  --c-op:#3D8FD6; --c-seg:#D9732F; --c-sal:#2E9E62; --c-eme:#E8475E; --c-amb:#2E9C88; --c-con:#B653AB; --c-nat:#8C90DC; --c-ofi:#A8B4BC;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0A1A12; --surface:#10261A; --subtle:#163222; --input:#0D2016; --border:#24412F; --border-strong:#3A5E47;
  --text:#EAF3EC; --muted:#A8BFB0; --green:#0E3B24; --green-2:#2E9E62; --green-tint:#183A27;
  --red:#FF5A70; --red-tint:#3A1720; --focus:#FF5A70;
  --c-op:#3D8FD6; --c-seg:#D9732F; --c-sal:#2E9E62; --c-eme:#E8475E; --c-amb:#2E9C88; --c-con:#B653AB; --c-nat:#8C90DC; --c-ofi:#A8B4BC;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--green)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;text-wrap:balance;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--green);color:var(--on-green);border-bottom:4px solid var(--red)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.logo{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center;height:48px;flex:none}
.logo img{height:40px;width:auto;display:block}
.ttl{flex:1;min-width:0}
.ttl h1{font-size:1.35rem;font-weight:800}
.ttl .code{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;opacity:.85;font-weight:700}
.chipbtn{border:1.5px solid rgba(255,255,255,.45);background:transparent;color:var(--on-green);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.82rem;cursor:pointer;flex:none}
.chipbtn:hover{background:rgba(255,255,255,.12)}

main{padding-block:18px 40px;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:20px;box-shadow:var(--shadow);min-width:0}

/* charla del día */
.today{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;border-left:6px solid var(--red)}
.today .eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--red)}
.today h2{font-size:1.5rem;color:var(--green-2);margin:2px 0 6px}
.today p{margin:0;color:var(--muted)}
.today .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* buscador y filtros */
.bar{display:grid;gap:12px}
.search{display:flex;align-items:center;gap:10px;background:var(--input);border:1.5px solid var(--border-strong);border-radius:999px;padding:8px 14px}
.search input{border:0;background:transparent;outline:none;flex:1;min-width:0;font-size:1rem}
.search svg{flex:none;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.84rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip .n{color:var(--muted);font-weight:700}
.chip[aria-pressed="true"]{background:var(--green-2);border-color:var(--green-2);color:#fff}
.chip[aria-pressed="true"] .n{color:rgba(255,255,255,.8)}
.count{color:var(--muted);font-size:.85rem;font-weight:700}
.row2{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.area{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:.84rem;color:var(--muted)}
.area select{background:var(--surface);border:1.5px solid var(--border-strong);border-radius:999px;padding:6px 12px;font-weight:800;color:var(--text);font-size:.88rem;max-width:62vw}
.refs{display:grid;gap:6px}
.refs .rl{font-size:.88rem}
.refs .rl b{color:var(--green-2)}
.mp{display:inline-block;font-size:.76rem;font-weight:800;border-radius:6px;padding:0 6px;background:var(--subtle);color:var(--green-2);margin-right:4px}

/* tarjetas */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.item{background:var(--surface);border:1px solid var(--border);border-top:5px solid var(--c);border-radius:var(--r-m);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.item .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{display:inline-flex;align-items:center;font-size:.72rem;font-weight:800;border-radius:999px;padding:1px 9px;color:#fff;background:var(--c);white-space:nowrap}
.id{font-size:.75rem;font-weight:800;color:var(--muted)}
.item h3{font-size:1.1rem}
.item .obj{color:var(--muted);font-size:.9rem;margin:0;flex:1}
.item .nom{font-size:.78rem;font-weight:700;color:var(--green-2)}
.item .acts{display:flex;gap:8px;margin-top:4px}
.empty{text-align:center;color:var(--muted);padding:30px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:8px 16px;font-weight:800;font-size:.9rem;cursor:pointer;border:1.5px solid var(--green-2);background:var(--surface);color:var(--green-2);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--green-tint)}
.btn.primary{background:var(--green-2);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--green-2)}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{padding:5px 12px;font-size:.82rem}
.btn.grow{flex:1}

/* detalle */
dialog.det{border:0;padding:0;border-radius:var(--r-m);width:min(760px,calc(100% - 24px));max-height:calc(100dvh - 24px);background:var(--surface);color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog.det::backdrop{background:rgba(10,26,18,.55)}
.dh{background:var(--green);color:#fff;padding:16px 20px;border-bottom:4px solid var(--red);display:flex;gap:12px;align-items:flex-start;position:sticky;top:0;z-index:2}
.dh h2{font-size:1.35rem;flex:1}
.dh .x{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-weight:800;flex:none}
.db{padding:18px 20px;display:grid;gap:16px}
.db h4{font-family:var(--font-display);font-size:1rem;color:var(--green-2);margin:0 0 6px}
.db ol,.db ul{margin:0;padding-left:22px;display:grid;gap:6px}
.db p{margin:0}
.msg{background:var(--red-tint);border-left:5px solid var(--red);padding:12px 14px;border-radius:var(--r-s);font-weight:800}
.form{background:var(--subtle);border-radius:var(--r-m);padding:14px;display:grid;gap:10px}
.form .row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form label{display:grid;gap:3px;font-size:.8rem;font-weight:800;color:var(--muted)}
.form input,.form select{background:var(--input);border:1.5px solid var(--border-strong);border-radius:var(--r-s);padding:8px 10px;font-size:.95rem;color:var(--text);min-width:0;width:100%}
.dacts{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:.78rem;color:var(--muted);margin:0}

footer{color:var(--muted);font-size:.78rem;padding-block:10px 30px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;font-size:.9rem;z-index:60;max-width:calc(100% - 32px);text-align:center}

@media (max-width:640px){
  .ttl h1{font-size:1.1rem}
  .ttl .code{font-size:.68rem}
  .logo{height:40px}.logo img{height:32px}
  .today{grid-template-columns:minmax(0,1fr)}
  .today .acts .btn{flex:1}
  .form .row{grid-template-columns:minmax(0,1fr)}
  .dacts .btn{flex:1 1 calc(50% - 8px)}
  .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .chip{flex:none}
}
</style>
</head>

"Respeta la zona de exclusión delimitada alrededor de la grúa y de la trayectoria de giro.",
"Solo un señalero autorizado da indicaciones al operador; usa el canal de radio asignado y señales estándar.",
"Revisa spreader, eslingas, grilletes y ganchos antes de usarlos; si están dañados, retíralos y repórtalos.",
"Detén la maniobra si el viento supera el límite indicado por el fabricante o si pierdes contacto visual o de radio.",
"No guíes la carga con las manos: usa cabos guía (vientos) y mantén las manos fuera de puntos de atrapamiento."],
ask:["¿Quién es el único que puede dar señales al operador en tu maniobra?","¿Qué haces si se pierde la comunicación por radio a mitad del izaje?"],
msg:"Debajo de la carga no hay lugar seguro: si no la ves, no te acerques."},

{id:"C-02",cat:"op",t:"Tránsito en patio: tractores, reach stackers y peatones",min:5,nom:"NOM-006-STPS · Reglamento interno",miper:[6,79],areas:[],
obj:"Prevenir atropellamientos y choques en patios de contenedores y vialidades de la terminal.",
pts:["Respeta los límites de velocidad y el sentido de circulación señalizados en la terminal.",
"Los peatones solo circulan por rutas marcadas y siempre con chaleco de alta visibilidad.",
"Antes de cruzar frente a un equipo, haz contacto visual con el operador y espera su señal.",
"Las reach stackers y tractores tienen puntos ciegos grandes: nunca camines detrás de un equipo en reversa.",
"Usa cinturón de seguridad en todo equipo que lo tenga y no uses el celular mientras conduces.",
"Reporta baches, derrames o falta de señalización en vialidades."],
ask:["¿Dónde están los puntos ciegos de una reach stacker?","¿Qué ruta peatonal usas para llegar a tu área?"],
msg:"Ver y ser visto: el contacto visual con el operador salva vidas."},

{id:"C-03",cat:"op",t:"Trincado y destrincado de contenedores",min:7,nom:"NOM-009-STPS · Convenio 152 OIT",miper:[2,3,7,14],areas:["naves","contenedores"],
obj:"Reducir lesiones por caídas, golpes y sobreesfuerzo al colocar o retirar conos y barras de trinca.",
pts:["Trabaja solo en superficies con barandal o con arnés anclado cuando estés sobre cubierta o pasarelas de trinca.",
"Inspecciona conos, barras y tensores; los deformados se separan y se reportan.",
"Coordina con el señalero: nadie destrinca debajo o junto a una estiba que está siendo movida por la grúa.",
"Manipula las barras entre dos personas cuando sea necesario y con la postura correcta.",
"Usa casco con barboquejo, guantes, botas y chaleco; guarda los conos en contenedores o canastas, nunca sueltos en cubierta.",
"Mantén libres los pasillos de la cubierta para tener siempre una ruta de escape."],
ask:["¿Qué riesgo hay al dejar conos sueltos en cubierta?","¿Cuándo es obligatorio el arnés durante el trincado?"],
msg:"Un cono suelto es un proyectil: guárdalo en su lugar."},

{id:"C-04",cat:"op",t:"Acceso seguro a buques: escala real y planchada",min:5,nom:"Convenio 152 OIT · NOM-009-STPS",miper:[2,14,64],areas:["naves"],
obj:"Subir y bajar de los buques sin caídas al agua ni entre buque y muelle.",
pts:["Verifica que la escala tenga red de seguridad debajo, pasamanos firme e iluminación adecuada.",
"Usa siempre tres puntos de apoyo y las manos libres; las herramientas se suben con cabo o bolsa.",
"Una persona a la vez en tramos angostos; respeta la capacidad indicada.",
"Ten un aro salvavidas con cabo cerca del acceso y conoce su ubicación.",
"No subas si la escala se mueve en exceso por la marea o el oleaje: avisa al supervisor y a la tripulación."],
ask:["¿Dónde está el salvavidas más cercano a tu muelle?","¿Qué revisas antes de subir por la escala?"],
msg:"Entre el buque y el muelle no hay segundas oportunidades."},

{id:"C-05",cat:"op",t:"Amarre y desamarre: la zona de latigazo",min:5,nom:"Convenio 152 OIT · Procedimiento interno",miper:[4,14,64],areas:["naves","cabotaje"],
obj:"Identificar las zonas de latigazo (snap-back) y trabajar fuera de ellas durante el amarre.",
pts:["Un cabo que se revienta regresa con fuerza suficiente para causar lesiones graves o la muerte.",
"Nunca te pares dentro de un seno del cabo ni en línea con un cabo en tensión.",
"Atiende solo las instrucciones del encargado de amarre y mantén comunicación con el buque.",
"Usa guantes, chaleco salvavidas y calzado antiderrapante en la orilla del muelle.",
"Mantén limpio el borde del muelle: sin aceite, cabos sueltos ni objetos que provoquen tropiezos."],
ask:["¿Dónde está la zona de latigazo en un bolardo?","¿Qué haces si un cabo empieza a crujir o deshilacharse?"],
msg:"Si el cabo está tenso, tú fuera de su línea."},

{id:"C-06",cat:"op",t:"Manejo seguro de acero: bobinas y placas",min:7,nom:"NOM-006-STPS",miper:[9,10,11],areas:["acero","naves"],
obj:"Prevenir atrapamientos y aplastamientos al descargar, estibar y entregar acero.",
pts:["Las bobinas pueden rodar: calza siempre antes de soltar y nunca te coloques en su dirección de rodamiento.",
"Verifica el peso de cada pieza contra la capacidad del equipo y de los accesorios de izaje.",
"Mantén las manos fuera entre la carga y la estiba; usa ganchos o barras guía.",
"Estiba en la altura y forma indicadas, sobre durmientes en buen estado y piso nivelado.",
"Revisa que los flejes estén completos; un fleje roto puede soltar placas o desenrollar la bobina."],
ask:["¿Hacia dónde puede rodar una bobina que estás descargando?","¿Qué haces si encuentras un fleje roto?"],
msg:"El acero no perdona: calza, verifica y aléjate."},

{id:"C-07",cat:"op",t:"Movimiento de vehículos (carga rodada)",min:5,nom:"Reglamento interno · NOM-006-STPS",miper:[6,4],areas:["autos"],
obj:"Mover vehículos de importación y exportación sin choques, atropellamientos ni daños.",
pts:["Conduce a la velocidad indicada en rampa, cubierta y patio; nunca hagas carreras para ganar tiempo.",
"Usa el cinturón aunque el recorrido sea corto.",
"Sigue las indicaciones del guía; no te bajes del vehículo en la rampa.",
"Peatones fuera de las rutas de conducción; los traslados en van se hacen sentados y con puertas cerradas.",
"Reporta cualquier daño al vehículo al momento, sin intentar moverlo si representa riesgo."],
ask:["¿Cuál es el límite de velocidad en la rampa del buque?","¿Qué riesgo tiene bajarse de un auto en la rampa?"],
msg:"Cada auto es un recorrido completo: con calma y con cinturón."},

{id:"C-08",cat:"op",t:"Montacargas: operación segura",min:7,nom:"NOM-006-STPS",miper:[6,9,10],areas:["almacenes","cfs","acero"],
obj:"Operar montacargas sin volcaduras, caída de carga ni atropellamientos.",
pts:["Solo opera quien está capacitado y autorizado; haz la revisión diaria antes de arrancar.",
"Nunca excedas la capacidad de la placa; considera el centro de carga.",
"Circula con las horquillas bajas y la carga inclinada hacia atrás; en rampa, la carga va del lado de arriba.",
"Si la carga tapa tu visión, avanza en reversa o pide un guía.",
"Nadie viaja en las horquillas ni en el montacargas aparte del operador.",
"Al estacionar: horquillas en el piso, freno puesto y llave retirada."],
ask:["¿Dónde ves la capacidad del montacargas?","¿Cómo subes una rampa con carga?"],
msg:"Un montacargas no es un elevador de personas."},

{id:"C-09",cat:"seg",t:"Equipo de protección personal",min:5,nom:"NOM-017-STPS",areas:[],
obj:"Recordar qué EPP usar en cada área y cómo cuidarlo.",
pts:["El EPP es la última barrera: no sustituye las medidas de control, pero es obligatorio donde se indica.",
"Básico en terminal: casco, chaleco de alta visibilidad, botas de seguridad, lentes y guantes según la tarea.",
"Revísalo antes de usarlo; si está roto o vencido, solicita reposición.",
"Úsalo bien ajustado: un casco sin suspensión o lentes en la frente no protegen.",
"Guárdalo limpio y fuera del sol; no lo modifiques ni lo pintes."],
ask:["¿Qué EPP necesitas para tu tarea de hoy?","¿Con quién pides reposición de EPP?"],
msg:"Tu EPP solo funciona si lo traes puesto."},

{id:"C-10",cat:"seg",t:"Bloqueo y etiquetado de energía (LOTO)",min:7,nom:"NOM-004-STPS · NOM-029-STPS",miper:[13,15,16,12],areas:["maestranza","equipos"],
obj:"Evitar arranques inesperados durante mantenimiento a grúas, equipos y maquinaria.",
pts:["Antes de intervenir, identifica todas las fuentes de energía: eléctrica, hidráulica, neumática, mecánica y gravedad.",
"Apaga, aísla y coloca tu propio candado y tarjeta; cada trabajador lleva su candado.",
"Libera energía residual (presión, resortes, cargas suspendidas) y prueba que el equipo no arranque.",
"Nadie retira el candado de otro.",
"Al terminar: retira herramientas, avisa al personal y solo entonces retira bloqueos."],
ask:["¿Cuántas fuentes de energía tiene el equipo que vas a intervenir?","¿Qué haces si encuentras un candado de alguien que ya se fue?"],
msg:"Mi candado, mi llave, mi vida."},

{id:"C-11",cat:"seg",t:"Trabajo en alturas",min:7,nom:"NOM-009-STPS",miper:[2,78],areas:[],
obj:"Prevenir caídas en grúas, estibas, techos y escaleras.",
pts:["Trabajo en altura es arriba de 1.80 m o junto a bordes sin protección: requiere permiso y equipo.",
"Usa arnés de cuerpo completo con línea de vida y ánclalo a un punto certificado, nunca a tubería o barandal improvisado.",
"Inspecciona arnés, línea y conectores antes de cada uso.",
"Escaleras: firmes, en ángulo correcto, sobresaliendo 90 cm del punto de apoyo y con tres puntos de contacto.",
"Delimita el área de abajo y amarra herramientas para evitar caída de objetos.",
"Ten un plan de rescate antes de subir."],
ask:["¿A qué puedes anclar tu arnés en tu área de trabajo?","¿Quién te rescata si quedas suspendido?"],
msg:"Si no estás anclado, no subes."},

{id:"C-12",cat:"seg",t:"Espacios confinados: bodegas de buque",min:7,nom:"NOM-033-STPS",miper:[26,27,41],areas:["naves"],
obj:"Entrar a bodegas, tanques y fosas sin riesgo de asfixia o intoxicación.",
pts:["Las bodegas pueden tener poco oxígeno o gases de fumigación, aunque no huelan a nada.",
"Nadie entra sin permiso de trabajo y sin monitoreo de atmósfera (oxígeno, explosividad y tóxicos).",
"Debe haber vigía afuera en todo momento y comunicación constante.",
"Ventila antes y durante el trabajo; ten listo el equipo de rescate.",
"Si alguien se desmaya adentro, no entres a rescatarlo sin equipo: activa la emergencia."],
ask:["¿Cuál es el rango seguro de oxígeno?","¿Qué hace el vigía si pierde contacto con el que entró?"],
msg:"La mayoría de las muertes en espacios confinados son de rescatistas improvisados."},

{id:"C-13",cat:"seg",t:"Trabajos en caliente: soldadura y corte",min:5,nom:"NOM-027-STPS",miper:[19,20,21,36,38,23],areas:["maestranza","obra"],
obj:"Evitar incendios, quemaduras y lesiones oculares en trabajos de soldadura, corte y esmerilado.",
pts:["Requiere permiso de trabajo en caliente y revisión del área (10 m libres de material combustible).",
"Ten un extintor a la mano y un vigía contra incendio durante y después del trabajo.",
"Usa careta con filtro adecuado, guantes de carnaza, mangas y peto.",
"Revisa mangueras, reguladores y arrestaflamas; cilindros siempre en posición vertical y encadenados.",
"Vigila el área al menos 30 minutos al terminar, por posibles chispas ocultas."],
ask:["¿Qué hay a 10 m del lugar donde vas a soldar?","¿Por qué se vigila el área después de terminar?"],
msg:"Una chispa basta: permiso, extintor y vigía."},

{id:"C-14",cat:"seg",t:"Seguridad eléctrica",min:5,nom:"NOM-029-STPS",miper:[15,16,74],areas:[],
obj:"Prevenir descargas eléctricas en tableros, extensiones y equipos.",
pts:["Solo personal calificado y autorizado trabaja en instalaciones eléctricas.",
"Revisa cables y extensiones: sin empalmes con cinta, aislamiento dañado ni clavijas rotas.",
"Mantén libre el acceso a tableros; nunca los dejes abiertos.",
"No trabajes con manos o pies mojados; en el muelle la humedad y la sal aumentan el riesgo.",
"Ante una persona electrocutada, corta la energía antes de tocarla."],
ask:["¿Hay extensiones dañadas en tu área?","¿Qué haces primero si ves a alguien electrocutándose?"],
msg:"La electricidad no se ve, no se oye y no avisa."},

{id:"C-15",cat:"seg",t:"Orden y limpieza en muelle y almacenes",min:5,nom:"NOM-001-STPS",miper:[1,5,77],areas:[],
obj:"Mantener áreas libres de tropiezos, resbalones y obstrucciones.",
pts:["Cada cosa en su lugar: herramientas, cabos, conos y madera de estiba.",
"Limpia derrames de aceite o diésel de inmediato o señalízalos.",
"Mantén libres pasillos, salidas de emergencia, extintores y regaderas.",
"Coloca la basura y los residuos en su contenedor correcto.",
"Al terminar el turno, deja el área como te gustaría encontrarla."],
ask:["¿Qué objeto mal colocado viste hoy en tu área?","¿Quién es responsable del orden en tu zona?"],
msg:"Un área ordenada es un área segura."},

{id:"C-16",cat:"sal",t:"Calor extremo y golpe de calor",min:7,nom:"NOM-015-STPS",miper:[35],areas:[],
obj:"Reconocer los síntomas del estrés térmico y prevenirlo en las jornadas de calor de Mazatlán.",
pts:["Hidrátate antes de tener sed: un vaso de agua cada 15 a 20 minutos en jornadas de calor.",
"Toma pausas en sombra y rota tareas pesadas en las horas de más calor.",
"Señales de alarma: dolor de cabeza, mareo, náusea, calambres, piel muy caliente o confusión.",
"Si alguien muestra confusión o deja de sudar, es una emergencia: llévalo a la sombra, enfríalo y pide ayuda médica.",
"Evita bebidas energéticas y alcohol; comer ligero también ayuda.",
"Usa ropa clara y protección para el sol en cuello y cara."],
ask:["¿Cuánta agua has tomado en lo que va del turno?","¿Dónde está el punto de hidratación más cercano?"],
msg:"Cuídate y cuida al de al lado: el golpe de calor confunde a quien lo sufre."},

{id:"C-17",cat:"sal",t:"Ruido y protección auditiva",min:5,nom:"NOM-011-STPS",miper:[31],areas:[],
obj:"Prevenir la pérdida auditiva por exposición a ruido de equipos y buques.",
pts:["La pérdida auditiva por ruido es permanente y avanza sin dolor.",
"Usa protección auditiva donde está señalizado y cerca de motores, generadores y esmeriles.",
"Tapones: colócalos con las manos limpias, rodándolos y metiéndolos completos.",
"Si tienes que gritar para que te escuche alguien a un metro, el ruido es peligroso.",
"Participa en tus audiometrías y reporta zumbidos en los oídos."],
ask:["¿En qué zonas de la terminal es obligatoria la protección auditiva?","¿Cómo sabes si un tapón está bien colocado?"],
msg:"El oído que pierdes no se recupera."},

{id:"C-18",cat:"sal",t:"Manejo manual de cargas y ergonomía",min:5,nom:"NOM-036-1-STPS",miper:[47,49],areas:[],
obj:"Prevenir lesiones de espalda, hombros y manos al levantar o empujar cargas.",
pts:["Antes de levantar, evalúa el peso; si es pesado o voluminoso, pide ayuda o usa equipo mecánico.",
"Respeta los límites de masa de la NOM-036-1 según edad y sexo.",
"Dobla las rodillas, espalda recta, carga pegada al cuerpo y sin girar el tronco.",
"Empujar es mejor que jalar; mantén el camino despejado.",
"Haz pausas y estiramientos en tareas repetitivas."],
ask:["¿Qué carga de tu trabajo deberías levantar entre dos?","¿Qué equipo mecánico tienes disponible?"],
msg:"Tu espalda es para toda la vida: levanta con las piernas."},

{id:"C-19",cat:"sal",t:"Fatiga y trabajo por turnos",min:5,nom:"NOM-035-STPS",miper:[54,56],areas:[],
obj:"Reconocer la fatiga como un riesgo en operaciones de 24 horas.",
pts:["La fatiga reduce los reflejos igual que el alcohol.",
"Duerme de 7 a 8 horas; si trabajas de noche, oscurece tu cuarto y evita pantallas antes de dormir.",
"Señales: bostezos, ojos pesados, olvidos, microsueños.",
"Si sientes que te duermes operando un equipo, detente en un lugar seguro y avisa.",
"Come ligero en la noche y mantente hidratado."],
ask:["¿Qué haces para descansar entre turnos?","¿A quién avisas si sientes fatiga?"],
msg:"Avisar que estás cansado no es debilidad, es prevención."},

{id:"C-20",cat:"sal",t:"Factores de riesgo psicosocial",min:5,nom:"NOM-035-STPS",miper:[54,55,56],areas:[],
obj:"Conocer los canales para prevenir y atender el estrés, la violencia laboral y los acontecimientos traumáticos.",
pts:["El estrés intenso, las jornadas excesivas y la violencia laboral afectan la salud y la seguridad.",
"Todos merecen un trato respetuoso; el acoso y la violencia se denuncian.",
"Conoce el buzón o mecanismo de quejas de la empresa y que es confidencial.",
"Si viviste o presenciaste un accidente grave, tienes derecho a valoración y apoyo.",
"Cuida la comunicación con tu equipo: escuchar también previene accidentes."],
ask:["¿Conoces el mecanismo de quejas de la empresa?","¿Qué te ayuda a manejar el estrés en el trabajo?"],
msg:"La salud mental también es seguridad."},

{id:"C-21",cat:"eme",t:"Prevención de incendios y uso de extintores",min:7,nom:"NOM-002-STPS",miper:[19,21,22],areas:[],
obj:"Saber prevenir un incendio y usar un extintor correctamente.",
pts:["Conoce la ubicación de los extintores y salidas de tu área.",
"Usa el extintor solo si el fuego es pequeño y tienes una salida a tu espalda.",
"Técnica: Jala el seguro, Apunta a la base, Aprieta la manija y Barre de lado a lado.",
"Tipo de fuego: A sólidos, B líquidos inflamables, C eléctrico; el PQS sirve para A, B y C.",
"Si el fuego crece, evacúa, activa la alarma y no regreses por objetos.",
"Reporta extintores usados, sin presión o con el sello roto."],
ask:["¿Dónde está el extintor más cercano?","¿Qué tipo de fuego puede ocurrir en tu área?"],
msg:"Jala, apunta, aprieta y barre; y si crece, sal."},

{id:"C-22",cat:"nat",t:"Temporada de huracanes",min:7,nom:"NOM-002-STPS · Plan de emergencia TMAZ",miper:[57,63,64,59],areas:[],
obj:"Prepararnos para la temporada de ciclones del Pacífico (mayo a noviembre).",
pts:["Conoce el plan de emergencia de la terminal y tu rol en cada fase de alerta.",
"Sigue avisos oficiales de Protección Civil, Capitanía de Puerto y el Servicio Meteorológico Nacional.",
"Antes del evento: asegurar grúas, estibas, objetos sueltos y equipos; revisar drenajes.",
"Prepara tu mochila de emergencia en casa: documentos, agua, linterna, medicinas y radio.",
"Después del evento, no entres a áreas dañadas hasta que se revisen; cuidado con cables caídos."],
ask:["¿Cuál es tu tarea en el plan de huracanes?","¿Qué tienes listo en casa?"],
msg:"El huracán se prepara antes de que llegue."},

{id:"C-23",cat:"eme",t:"Mercancías peligrosas en contenedores (IMDG)",min:7,nom:"NOM-018-STPS · Código IMDG",miper:[18,24,26,28],areas:["contenedores","cfs","naves"],
obj:"Identificar contenedores con carga peligrosa y actuar ante una fuga.",
pts:["Reconoce las etiquetas de clase IMDG (rombos) y el número ONU en el contenedor.",
"Los contenedores peligrosos se estiban en la zona asignada y con la segregación indicada.",
"No abras ni intervengas un contenedor con olor, humo o derrame: aléjate en dirección contraria al viento.",
"Avisa de inmediato al supervisor y a seguridad; aísla el área.",
"Consulta la hoja de datos de seguridad (HDS) antes de cualquier manejo."],
ask:["¿Qué significa un rombo rojo con llama?","¿Hacia dónde te alejas si hay una fuga?"],
msg:"Si hay rombo, hay reglas; si hay fuga, aléjate y avisa."},

{id:"C-24",cat:"eme",t:"Primeros auxilios básicos",min:5,nom:"NOM-030-STPS",areas:[],
obj:"Saber qué hacer en los primeros minutos de una lesión.",
pts:["Primero tu seguridad: revisa que el área sea segura antes de acercarte.",
"Llama a emergencias internas y da ubicación clara.",
"Hemorragia: presión directa con gasa o tela limpia.",
"No muevas a un lesionado con posible golpe en cabeza o columna, salvo peligro inminente.",
"Conoce dónde están el botiquín, la camilla y el personal brigadista."],
ask:["¿Cuál es el número de emergencias de la terminal?","¿Dónde está el botiquín más cercano?"],
msg:"Saber actuar en el primer minuto cambia el resultado."},

{id:"C-25",cat:"amb",t:"Derrames de hidrocarburos en muelle",min:5,nom:"LGEEPA · Plan de contingencias",asp:["POSIBLE DERRAME DE MATERIALES PELIGROSOS"],areas:[],
obj:"Contener derrames de aceite y combustible antes de que lleguen al mar o al drenaje.",
pts:["Conoce la ubicación de los kits antiderrames y lo que contienen.",
"Detén la fuente si es seguro, y contén con barreras o material absorbente.",
"Protege las coladeras y el borde del muelle para que nada llegue al agua.",
"El material absorbente usado es residuo peligroso: va en su contenedor.",
"Reporta todo derrame, aunque sea pequeño; ciertos eventos requieren aviso a la autoridad."],
ask:["¿Dónde está el kit antiderrames de tu área?","¿Qué haces con el absorbente usado?"],
msg:"Lo que cae al muelle puede terminar en el mar."},

{id:"C-26",cat:"amb",t:"Separación de residuos y residuos peligrosos",min:5,nom:"LGPGIR · NOM-052-SEMARNAT",asp:["GENERACIÓN RESIDUOS PELIGROSOS","GENERACIÓN / ACOPIO RESIDUOS DE MANEJO ESPECIAL","GENERACIÓN / ACOPIO RESIDUOS SÓLIDOS URBANOS"],areas:[],
obj:"Separar correctamente los residuos y manejar los peligrosos de forma segura.",
pts:["Separa residuos según los contenedores de la terminal.",
"Aceites, filtros, estopas impregnadas, baterías y envases de químicos son residuos peligrosos.",
"Nunca mezcles residuos peligrosos con basura común.",
"Usa contenedores tapados, identificados y en el almacén temporal autorizado.",
"Reduce: usa solo lo necesario y reutiliza cuando sea seguro."],
ask:["¿Una estopa con aceite en qué contenedor va?","¿Dónde está el almacén temporal de residuos peligrosos?"],
msg:"Separar bien hoy es cuidar Mazatlán mañana."},

{id:"C-27",cat:"con",t:"Reporte de actos, condiciones inseguras y casi accidentes",min:5,nom:"NOM-019-STPS · NOM-030-STPS",areas:[],
obj:"Impulsar el reporte oportuno para corregir antes de que ocurra un accidente.",
pts:["Un casi accidente es un aviso gratuito: lo que no pasó hoy puede pasar mañana.",
"Reporta condiciones inseguras (equipo dañado, falta de señalización) y actos inseguros.",
"Reportar es para corregir, no para culpar.",
"Describe qué, dónde, cuándo y, si puedes, toma foto.",
"Da seguimiento: pregunta qué se hizo con tu reporte."],
ask:["¿Qué casi accidente has visto este mes?","¿Cómo y con quién reportas?"],
msg:"Lo que se reporta se corrige."},

{id:"C-28",cat:"con",t:"Autoridad para detener el trabajo",min:5,nom:"Política de seguridad TMAZ",areas:[],
obj:"Que todos sepan que pueden y deben detener una tarea insegura.",
pts:["Cualquier persona puede detener una tarea si ve un riesgo, sin importar su puesto.",
"Detén, avisa, corrige y luego continúa.",
"Nadie será sancionado por detener un trabajo de buena fe.",
"Si no entiendes un procedimiento o no tienes el equipo correcto, pregunta antes de empezar.",
"Reconoce a quien detiene un trabajo: está cuidando a todos."],
ask:["¿Alguna vez has detenido un trabajo?","¿Qué te impediría hacerlo?"],
msg:"Detenerse a tiempo nunca es pérdida de tiempo."},

{id:"C-29",cat:"con",t:"Distracciones: el celular en la operación",min:5,nom:"Reglamento interno",miper:[6],areas:[],
obj:"Eliminar el uso del celular en zonas de operación y conducción.",
pts:["Mirar el celular 3 segundos a 20 km/h es recorrer más de 15 metros a ciegas.",
"No uses el celular al conducir equipos ni al caminar en patio o muelle.",
"Si necesitas usarlo, detente en un área segura, fuera de rutas de equipos.",
"El radio es la herramienta de comunicación en la operación.",
"Los audífonos están prohibidos en áreas operativas: necesitas oír alarmas y equipos."],
ask:["¿Dónde puedes usar el celular de forma segura?","¿Qué alarma podrías no escuchar con audífonos?"],
msg:"Primero la operación, después el mensaje."},

{id:"C-30",cat:"con",t:"Alcohol y drogas en el trabajo",min:5,nom:"Ley Federal del Trabajo · Reglamento interno",areas:[],
obj:"Recordar la política de cero alcohol y drogas y sus riesgos en la operación portuaria.",
pts:["Presentarse bajo efectos de alcohol o drogas pone en riesgo tu vida y la de tus compañeros.",
"Los efectos de una noche de alcohol pueden durar hasta el día siguiente.",
"Algunos medicamentos causan sueño: avisa al médico si te recetan alguno.",
"Si ves a un compañero en esas condiciones, avisa al supervisor para retirarlo de la operación.",
"Si necesitas ayuda, acércate a Recursos Humanos o al servicio médico."],
ask:["¿Qué medicamentos pueden afectar tu trabajo?","¿Qué harías si un compañero llega en malas condiciones?"],
msg:"Cero alcohol, cero drogas, cero accidentes."},

{id:"C-31",cat:"op",t:"Caída al mar y hombre al agua",min:7,nom:"NOM-001-STPS · NOM-017-STPS",miper:[14,64],areas:["naves","cabotaje"],
obj:"Prevenir caídas al mar en el borde del muelle y saber cómo actuar si alguien cae al agua.",
pts:["Usa chaleco salvavidas siempre que trabajes a menos de 2 m del borde del muelle o en lanchas y escalas.",
"No camines ni te pares de espaldas al borde; respeta la franja amarilla y las defensas.",
"Si alguien cae: grita \"¡hombre al agua!\", no lo pierdas de vista y señálalo con el brazo.",
"Lanza el aro salvavidas con cabo; no te tires a rescatar sin chaleco ni sin apoyo.",
"Avisa por radio a Operaciones y Seguridad para detener hélices, grúas y maniobras cercanas.",
"Con oleaje irregular, aléjate del borde y suspende tareas que no sean indispensables."],
ask:["¿Dónde está el aro salvavidas más cercano a tu posición?","¿Qué es lo primero que haces si ves caer a alguien al mar?"],
msg:"En el borde del muelle, chaleco puesto y la vista en el agua."},

{id:"C-32",cat:"op",t:"Línea de fuego: atrapamientos entre carga y equipos",min:5,nom:"NOM-006-STPS",miper:[11,4,10],areas:[],
obj:"Identificar la línea de fuego y mantener el cuerpo fuera de los puntos donde la carga o el equipo pueden atraparte.",
pts:["La línea de fuego es cualquier lugar donde la carga, un equipo o una parte en movimiento puede golpearte o prensarte.",
"Nunca te coloques entre una carga suspendida y una estiba, pared, camión o costado del buque.",
"Las manos van fuera de los puntos de pellizco: usa cabos guía, ganchos o barras para posicionar la carga.",
"Antes de que se mueva un equipo, confirma tu ruta de escape: siempre debe haber una salida libre.",
"Si el operador no te ve, para él no existes: haz contacto visual antes de acercarte."],
ask:["¿Dónde está la línea de fuego en tu maniobra de hoy?","¿Cuál es tu ruta de escape si la carga gira o se suelta?"],
msg:"Fuera de la línea de fuego, siempre con salida."},

{id:"C-33",cat:"op",t:"Gate y báscula: transportistas y peatones",min:5,nom:"NOM-006-STPS · Reglamento interno",miper:[6,79,71],areas:["deposito"],
obj:"Coordinar con seguridad el ingreso, pesaje y salida de transportistas en Gate y báscula.",
pts:["Los transportistas siguen la ruta, velocidad y cajones indicados; no se permite que caminen por patio sin escolta.",
"El chofer permanece en la cabina o en la zona segura designada mientras se carga o descarga su unidad.",
"Al revisar sellos o documentos, colócate de frente al chofer y fuera del radio de giro del tractocamión.",
"Ante un transportista agresivo, no discutas: mantén distancia y llama a Protección.",
"Reporta unidades con fugas de aceite, llantas dañadas o carga mal asegurada antes de dejarlas ingresar."],
ask:["¿Dónde debe esperar el chofer mientras se maniobra su unidad?","¿A quién llamas si un transportista se pone agresivo?"],
msg:"En Gate, cada quien en su lugar y a la vista."},

{id:"C-34",cat:"op",t:"Apertura e inspección de contenedores en CFS",min:7,nom:"NOM-010-STPS · NOM-018-STPS",miper:[9,26,23],areas:["cfs","almacenes"],
obj:"Abrir y vaciar contenedores sin golpes por carga que se desploma ni exposición a gases de fumigación.",
pts:["Antes de abrir, revisa etiquetas de fumigación o de mercancía peligrosa en puertas y documentos.",
"Abre primero una sola puerta, parado a un lado, por si la carga se recargó contra ella y se viene encima.",
"Si el contenedor estuvo fumigado o huele raro, deja ventilar con puertas abiertas y no entres hasta que se autorice.",
"Usa el montacargas con la carga estable; no subas a la estiba dentro del contenedor.",
"Revisa el piso del contenedor: tablas rotas o clavos pueden voltear el montacargas o causar cortes."],
ask:["¿Qué etiqueta indica que un contenedor fue fumigado?","¿Por qué se abre primero una sola puerta?"],
msg:"Abre a un lado, ventila y luego entra."},

{id:"C-35",cat:"op",t:"Unidades reefer: conexión, energía y frío",min:5,nom:"NOM-029-STPS · NOM-015-STPS",miper:[16,39,74],areas:["reefer"],
obj:"Conectar, desconectar y probar contenedores refrigerados sin descargas eléctricas ni lesiones por frío.",
pts:["Revisa cable, clavija y contacto antes de conectar; si están dañados, no conectes y reporta.",
"Conecta y desconecta con el interruptor de la unidad apagado, nunca jalando el cable.",
"No conectes con manos o piso mojado; usa guantes dieléctricos donde se indique.",
"Para entrar a un contenedor congelado, usa ropa térmica y no te quedes dentro más tiempo del necesario.",
"Al terminar la PTI, desconecta y registra la unidad: así evitamos consumo de energía innecesario."],
ask:["¿Qué revisas antes de conectar un reefer?","¿Por qué se apaga la unidad antes de desconectar?"],
msg:"Apaga, conecta y luego enciende."},

{id:"C-36",cat:"seg",t:"Cilindros de gas y recipientes a presión",min:5,nom:"NOM-020-STPS · NOM-002-STPS",miper:[12,20],areas:["maestranza","equipos","obra"],
obj:"Manejar cilindros de oxígeno, acetileno y gas LP, y equipos a presión, sin fugas ni explosiones.",
pts:["Cilindros siempre en posición vertical, encadenados y con su capuchón cuando no se usan.",
"Separa oxígeno de gases combustibles al almacenarlos y mantenlos lejos del calor y del sol directo.",
"Revisa fugas con agua jabonosa, nunca con flama.",
"No uses grasa ni aceite en válvulas o reguladores de oxígeno.",
"Compresores, tanques y mangueras a presión solo se intervienen despresurizados y por personal autorizado."],
ask:["¿Cómo revisas si una conexión de gas tiene fuga?","¿Dónde se almacenan los cilindros en tu área?"],
msg:"Un cilindro caído es una bomba: encadénalo."},

{id:"C-37",cat:"seg",t:"Guardas y partes móviles de máquinas",min:5,nom:"NOM-004-STPS",miper:[13],areas:["maestranza","equipos"],
obj:"Evitar atrapamientos, amputaciones y cortes con partes móviles de equipos y máquinas.",
pts:["Nunca retires ni anules una guarda o dispositivo de seguridad para trabajar más rápido.",
"No uses ropa suelta, anillos, cadenas ni cabello suelto cerca de bandas, poleas o ejes.",
"No limpies, ajustes ni destrabes una máquina en movimiento: apaga y aplica bloqueo.",
"Respeta los paros de emergencia: deben estar visibles, accesibles y funcionando.",
"Si una guarda está rota o falta, detén el equipo y repórtalo."],
ask:["¿Qué máquina de tu área tiene partes móviles expuestas?","¿Dónde está su paro de emergencia?"],
msg:"La guarda protege tus manos: no la quites."},

{id:"C-38",cat:"seg",t:"Herramientas manuales y objetos punzocortantes",min:5,nom:"NOM-001-STPS · NOM-017-STPS",miper:[7],areas:[],
obj:"Prevenir cortes y golpes con herramientas manuales, flejes y bordes filosos.",
pts:["Usa cada herramienta para lo que fue hecha: una llave no es martillo ni un desarmador es palanca.",
"Revisa mangos, filos y cabezas antes de usarlas; las dañadas se retiran.",
"Corta flejes parado a un lado y con guantes anticorte: al soltarse brincan con fuerza.",
"Corta siempre en dirección contraria al cuerpo y guarda las navajas con el filo protegido.",
"Lleva las herramientas en cinturón o caja, no en los bolsillos."],
ask:["¿Qué herramienta dañada has visto en uso?","¿Cómo cortas un fleje de forma segura?"],
msg:"La herramienta correcta, en buen estado y bien usada."},

{id:"C-39",cat:"seg",t:"Esmerilado y proyección de partículas",min:5,nom:"NOM-004-STPS · NOM-017-STPS",miper:[8,31],areas:["maestranza","obra","equipos"],
obj:"Proteger ojos, cara y a terceros al esmerilar, cortar o picar.",
pts:["Usa lentes de seguridad y careta de esmerilar; los lentes solos no bastan.",
"Revisa que el disco sea del tamaño y RPM correctos para la esmeriladora y que tenga su guarda.",
"Delimita el área: las chispas y fragmentos alcanzan a quien pasa cerca.",
"Sujeta bien la pieza y no esmerilés con el lateral de un disco de corte.",
"Usa protección auditiva; la esmeriladora genera ruido que daña el oído."],
ask:["¿Qué EPP usas para esmerilar?","¿Cómo revisas que el disco es el correcto?"],
msg:"Lentes, careta y área delimitada."},

{id:"C-40",cat:"seg",t:"Desplome de estibas y derrumbe de carga",min:5,nom:"NOM-006-STPS · NOM-001-STPS",miper:[9],areas:["contenedores","cfs","almacenes","acero","deposito"],
obj:"Prevenir que estibas de contenedores, carga suelta o tarimas se derrumben sobre las personas.",
pts:["Estiba solo hasta la altura autorizada para cada tipo de carga y área.",
"Revisa que la base esté nivelada, sobre durmientes en buen estado y sin hundimientos.",
"No camines ni te refugies entre estibas o pasillos angostos de contenedores.",
"No saques piezas de la parte de abajo de una estiba.",
"Reporta estibas inclinadas, contenedores dañados o tarimas rotas antes de seguir trabajando."],
ask:["¿Cuál es la altura máxima de estiba en tu área?","¿Qué haces si ves una estiba inclinada?"],
msg:"Una estiba bien hecha no se cae; una mal hecha, sí."},

{id:"C-41",cat:"seg",t:"Sustancias químicas: hoja de datos y etiquetas",min:5,nom:"NOM-018-STPS · NOM-005-STPS",miper:[24,25,28],areas:[],
obj:"Identificar los peligros de los químicos que usamos y manejarlos con seguridad.",
pts:["Todo recipiente debe tener etiqueta con pictogramas; si no la tiene, no lo uses.",
"Consulta la hoja de datos de seguridad (HDS) antes de usar un producto nuevo.",
"No trasvases químicos a botellas de refresco ni recipientes sin etiqueta.",
"Usa el EPP que indica la HDS: guantes, lentes, careta o respirador.",
"Si te salpica, lava con abundante agua al menos 15 minutos y avisa al servicio médico."],
ask:["¿Dónde están las HDS de los productos de tu área?","¿Qué significa el pictograma de la calavera?"],
msg:"Sin etiqueta, no se usa."},

{id:"C-42",cat:"seg",t:"Quemaduras por superficies calientes",min:5,nom:"NOM-015-STPS · NOM-017-STPS",miper:[36],areas:["maestranza","equipos"],
obj:"Evitar quemaduras con motores, escapes, piezas soldadas y fluidos calientes.",
pts:["Deja enfriar motores, escapes e hidráulicos antes de intervenirlos.",
"No abras el tapón del radiador en caliente: el vapor y el anticongelante queman.",
"Marca con gis o letrero las piezas recién soldadas o cortadas.",
"Usa guantes de carnaza para manipular piezas calientes.",
"Ante una quemadura, enfría con agua corriente y avisa; no pongas pasta, hielo ni remedios."],
ask:["¿Cuánto tiempo dejas enfriar un motor antes de trabajarlo?","¿Qué se hace ante una quemadura?"],
msg:"Si estuvo encendido, asume que quema."},

{id:"C-43",cat:"seg",t:"Excavaciones y zanjas en obra civil",min:5,nom:"NOM-031-STPS",miper:[67,15,16],areas:["obra"],
obj:"Trabajar en excavaciones sin caídas, derrumbes ni contacto con instalaciones enterradas.",
pts:["Antes de excavar, confirma con planos dónde pasan tuberías y cables enterrados.",
"Delimita y señaliza toda excavación, de día y de noche.",
"Las zanjas profundas requieren taludes o ademes; no entres si la pared se ve inestable.",
"Deja la tierra y el material a más de 60 cm del borde.",
"Usa escaleras para entrar y salir; nunca brinques ni te cuelgues del borde."],
ask:["¿Quién confirma qué hay bajo el piso antes de excavar?","¿Cómo se señaliza una excavación de noche?"],
msg:"Antes de excavar, conoce lo que hay abajo."},

{id:"C-44",cat:"seg",t:"Escaleras fijas, rampas y pasillos",min:5,nom:"NOM-001-STPS",miper:[51,52,1],areas:[],
obj:"Prevenir caídas en escaleras, rampas, pasarelas y pasillos de la terminal.",
pts:["Sube y baja escaleras con tres puntos de contacto y una mano en el pasamanos.",
"No cargues objetos que te tapen la vista o te ocupen ambas manos en escaleras.",
"Reporta escalones rotos, pasamanos flojos y antiderrapantes desgastados.",
"En rampas mojadas o con aceite, camina despacio y por la orilla con pasamanos.",
"No corras en pasillos ni bajes viendo el celular."],
ask:["¿Qué escalera o rampa de tu área necesita reparación?","¿Por qué se usan tres puntos de contacto?"],
msg:"Una mano para ti, siempre en el pasamanos."},

{id:"C-45",cat:"seg",t:"Electricidad estática y carga de combustible",min:5,nom:"NOM-022-STPS · NOM-002-STPS",miper:[17,21,22],areas:["equipos","maestranza"],
obj:"Cargar combustible a equipos portuarios sin chispas, incendios ni derrames.",
pts:["Apaga el motor, el radio y el celular antes de cargar combustible.",
"Conecta la tierra física cuando el equipo de carga la tenga.",
"Prohibido fumar o hacer trabajos en caliente en la zona de carga.",
"No llenes el tanque hasta derramar; ten absorbente y extintor a la mano.",
"Si hay derrame, detén la carga, contén con absorbente y avisa a Medio Ambiente."],
ask:["¿Qué apagas antes de cargar combustible?","¿Dónde está el extintor más cercano a la zona de carga?"],
msg:"Motor apagado, sin flama y sin derrame."},

{id:"C-46",cat:"seg",t:"Agresiones de terceros y vandalismo",min:5,nom:"Ley de Seguridad Pública del Estado de Sinaloa · Protección portuaria",miper:[69,70,71],areas:["proteccion","deposito"],
obj:"Saber cómo actuar ante conflictos con terceros, intrusos o actos de vandalismo.",
pts:["No enfrentes físicamente a una persona agresiva o a un intruso.",
"Mantén distancia, conserva la calma y avisa a Protección por radio.",
"Reporta personas sin identificación o en zonas restringidas.",
"Porta siempre tu gafete visible y no prestes tu acceso.",
"Después de un evento, reporta lo ocurrido aunque no haya lesionados."],
ask:["¿Cuál es el canal de radio de Protección?","¿Qué haces si ves a alguien sin gafete en el muelle?"],
msg:"Tu seguridad primero: aléjate y avisa."},

{id:"C-47",cat:"sal",t:"Polvos de graneles y calidad del aire",min:5,nom:"NOM-010-STPS · NOM-017-STPS",miper:[23,41],areas:["naves"],
obj:"Proteger las vías respiratorias durante la descarga de graneles y en áreas con polvo.",
pts:["En descargas de granel, usa respirador del tipo indicado, bien ajustado y sin barba que impida el sello.",
"Colócate en contra del viento respecto a la tolva o el punto de descarga.",
"Cambia los filtros cuando cueste respirar o según el programa.",
"Lávate cara y manos antes de comer o fumar.",
"Reporta tos persistente, ardor de ojos o dificultad para respirar."],
ask:["¿Qué respirador usas en la descarga de granel?","¿Cómo revisas que el respirador sella bien?"],
msg:"El polvo que no ves también se respira."},

{id:"C-48",cat:"sal",t:"Vibración en operadores de equipo",min:5,nom:"NOM-024-STPS",miper:[34,46],areas:["equipos","autos"],
obj:"Reducir los efectos de la vibración en operadores de grúas, tractos, reach stackers y montacargas.",
pts:["Ajusta el asiento y el respaldo a tu estatura antes de iniciar el turno.",
"Reporta asientos dañados, amortiguadores vencidos o suspensión defectuosa.",
"Circula a velocidad moderada sobre baches y juntas del pavimento.",
"Haz pausas para bajar del equipo y estirar espalda y piernas.",
"Avisa al servicio médico si tienes dolor de espalda o entumecimiento frecuente."],
ask:["¿Cada cuánto ajustas el asiento de tu equipo?","¿Qué bache o junta de patio te sacude más?"],
msg:"Un asiento bien ajustado cuida tu espalda."},

{id:"C-49",cat:"sal",t:"Iluminación en turnos nocturnos",min:5,nom:"NOM-025-STPS",miper:[32],areas:[],
obj:"Trabajar de noche con buena visibilidad en muelle, patios y almacenes.",
pts:["Reporta lámparas fundidas o zonas oscuras en tu área de trabajo.",
"Usa chaleco con reflejante en buen estado: de noche es lo que te hace visible.",
"No mires directo a reflectores o faros; tus ojos tardan en recuperarse.",
"Usa lámpara de mano para revisar sellos, amarres y zonas sin luz.",
"Si no ves bien la maniobra, detenla hasta tener iluminación suficiente."],
ask:["¿Qué zona de tu área queda oscura de noche?","¿Cómo está el reflejante de tu chaleco?"],
msg:"Si no se ve, no se trabaja."},

{id:"C-50",cat:"sal",t:"Postura de pie, sentado y tareas repetitivas",min:5,nom:"NOM-030-STPS · NOM-036-1-STPS",miper:[46,49,50],areas:[],
obj:"Prevenir dolores de espalda, cuello y muñecas por posturas sostenidas o movimientos repetitivos.",
pts:["Cambia de postura al menos cada 30 a 60 minutos.",
"Si trabajas de pie, apoya un pie en un escalón y usa calzado cómodo.",
"Si trabajas sentado, espalda apoyada, pies en el piso y codos a 90 grados.",
"Alterna tareas repetitivas con otras actividades cuando sea posible.",
"Haz estiramientos cortos de cuello, hombros y muñecas durante el turno."],
ask:["¿Qué tarea repetitiva haces más en tu turno?","¿Qué estiramiento puedes hacer en tu puesto?"],
msg:"Moverse también es parte del trabajo."},

{id:"C-51",cat:"sal",t:"Fauna nociva, mordidas y picaduras",min:5,nom:"NOM-030-STPS",miper:[65,66],areas:[],
obj:"Prevenir mordidas y picaduras de animales y enfermedades transmitidas por vectores.",
pts:["Revisa con lámpara antes de meter las manos en huecos, cajas o carga almacenada.",
"No alimentes perros, gatos ni aves en la terminal: atraen fauna y plagas.",
"Usa repelente en temporada de lluvias y elimina agua estancada (criadero de mosquitos).",
"Si ves serpientes, alacranes o roedores, no los manipules: avisa a Seguridad.",
"Ante una mordida o picadura, lava la zona y acude al servicio médico."],
ask:["¿Dónde has visto fauna en tu área?","¿Qué recipientes con agua estancada hay cerca?"],
msg:"No metas la mano donde no ves."},

{id:"C-52",cat:"sal",t:"Higiene y agentes biológicos",min:5,nom:"NOM-030-STPS · NOM-017-STPS",miper:[42,43,44],areas:[],
obj:"Prevenir enfermedades por virus, bacterias y hongos en áreas comunes y en la carga.",
pts:["Lávate las manos con agua y jabón antes de comer y después de ir al baño.",
"No compartas vasos, botellas ni EPP de uso personal.",
"Si tienes síntomas de enfermedad contagiosa, avisa al servicio médico antes de presentarte.",
"Usa guantes con carga en descomposición, sucia o húmeda.",
"Mantén limpios comedores y vestidores; reporta sanitarios sin agua o jabón."],
ask:["¿Dónde puedes lavarte las manos cerca de tu área?","¿Qué EPP es de uso personal y no se comparte?"],
msg:"Manos limpias, menos enfermedades."},

{id:"C-53",cat:"nat",t:"Vientos fuertes: cuándo suspender maniobras",min:5,nom:"Ley General de Protección Civil · Plan de emergencia TMAZ",miper:[63,3,10],areas:[],
obj:"Reconocer cuándo el viento hace insegura una maniobra y qué asegurar.",
pts:["Las grúas tienen un límite de viento del fabricante; el operador detiene el izaje al alcanzarlo.",
"Con viento fuerte, las cargas grandes (contenedores vacíos, láminas, aspas) se comportan como velas.",
"Asegura objetos sueltos: conos, tapas, lonas, madera y herramienta.",
"Aléjate de estibas altas de contenedores vacíos.",
"Sigue las indicaciones de Operaciones para suspender y reanudar."],
ask:["¿Qué carga de tu área se mueve más con el viento?","¿Quién decide suspender la maniobra?"],
msg:"Con viento, la carga manda: detente a tiempo."},

{id:"C-54",cat:"nat",t:"Tormentas eléctricas y rayos",min:5,nom:"Ley General de Protección Civil · NOM-022-STPS",miper:[59],areas:[],
obj:"Protegernos de descargas eléctricas por rayo durante tormentas.",
pts:["Si escuchas truenos, estás al alcance de un rayo: busca refugio.",
"Baja de grúas, estibas, techos de contenedor y estructuras altas.",
"No te refugies bajo árboles, postes ni torres de iluminación.",
"Dentro de un vehículo cerrado o un edificio estás más seguro.",
"Espera 30 minutos después del último trueno para regresar."],
ask:["¿Dónde está el refugio más cercano a tu área?","¿Cuánto esperas después del último trueno?"],
msg:"Si truena, refúgiate."},

{id:"C-55",cat:"nat",t:"Sismo y tsunami en la terminal",min:5,nom:"Ley General de Protección Civil · Ley de Protección Civil del Estado de Sinaloa",miper:[58,62],areas:[],
obj:"Saber cómo actuar ante un sismo y ante una alerta de tsunami en la costa.",
pts:["Durante el sismo: aléjate de estibas, cristales y objetos que puedan caer.",
"Si operas un equipo, detenlo en un lugar seguro, baja la carga si es posible y quédate dentro si no hay riesgo.",
"Después del sismo, acude al punto de reunión y no regreses hasta que se revise el área.",
"Si el sismo fue fuerte y largo, o hay alerta oficial de tsunami, aléjate del muelle hacia zonas altas.",
"Sigue las rutas de evacuación y las indicaciones de Protección Civil."],
ask:["¿Dónde está tu punto de reunión?","¿Hacia dónde evacuarías ante alerta de tsunami?"],
msg:"Sismo fuerte en la costa: aléjate del mar."},

{id:"C-56",cat:"nat",t:"Lluvias intensas e inundaciones",min:5,nom:"Ley General de Protección Civil · Plan de emergencia TMAZ",miper:[57,60,16],areas:[],
obj:"Trabajar con seguridad durante lluvias fuertes y encharcamientos.",
pts:["No camines ni conduzcas por zonas inundadas: puede haber registros abiertos o cables.",
"Reduce la velocidad de equipos: el piso mojado alarga el frenado.",
"Revisa que coladeras y canaletas estén libres antes de la temporada de lluvias.",
"Protege tableros y conexiones eléctricas del agua; no los manipules mojados.",
"Reporta goteras o filtraciones en almacenes que puedan dañar mercancía o equipos."],
ask:["¿Qué zona de tu área se inunda?","¿Qué cambia en la operación de tu equipo con lluvia?"],
msg:"Agua y electricidad no se mezclan."},

{id:"C-57",cat:"eme",t:"Respuesta a emergencias ambientales",min:5,nom:"Manual de emergencias ambientales TMAZ-SIG-AMB-MAN-09 · LGEEPA",asp:["POSIBLE DERRAME DE MATERIALES PELIGROSOS","POSIBLE FUGA DE GASES","POSIBLE INCENDIO / EXPLOSIÓN"],areas:[],
obj:"Saber qué hacer y a quién avisar ante un derrame, fuga o incendio con efecto ambiental.",
pts:["Tu seguridad primero: si el evento te rebasa, aléjate y avisa.",
"Avisa de inmediato a tu supervisor, a Seguridad y a Medio Ambiente.",
"Si es seguro, detén la fuente (cierra válvula, endereza el recipiente) y contén con el kit.",
"Protege coladeras y el borde del muelle para que nada llegue al mar.",
"Todo incidente se reporta en Zyght y al área de Medio Ambiente, aunque sea pequeño."],
ask:["¿Dónde está el kit antiderrames más cercano?","¿En qué sistema se reporta un incidente ambiental?"],
msg:"Contén, avisa y reporta en Zyght."},

{id:"C-58",cat:"ofi",t:"Trabajo en computadora y pantallas",min:5,nom:"NOM-030-STPS · NOM-025-STPS",miper:[72,48],areas:["ti"],
obj:"Prevenir fatiga visual y molestias musculares en el trabajo de oficina.",
pts:["La parte superior de la pantalla va a la altura de los ojos, a un brazo de distancia.",
"Aplica la regla 20-20-20: cada 20 minutos mira a 6 m de distancia durante 20 segundos.",
"Teclado y mouse a la altura de los codos, muñecas rectas.",
"Evita reflejos de ventanas o lámparas en la pantalla.",
"Levántate y camina unos minutos cada hora."],
ask:["¿Tu pantalla está a la altura correcta?","¿Qué cambio puedes hacer hoy en tu escritorio?"],
msg:"Pausas cortas evitan dolores largos."},

{id:"C-59",cat:"ofi",t:"Cuarto de servidores: baterías y agente limpio",min:5,nom:"NOM-029-STPS · NOM-002-STPS",miper:[73,74,75,76],areas:["ti"],
obj:"Entrar y trabajar en el site sin riesgos eléctricos, químicos ni de asfixia.",
pts:["Solo entra personal autorizado y registrado.",
"Conoce la alarma del sistema de supresión por agente limpio: si suena, sal de inmediato.",
"No intervengas racks ni UPS energizados sin procedimiento y sin bloqueo.",
"Revisa baterías de UPS: hinchadas, calientes o con fuga se reportan y no se manipulan.",
"Mantén pasillos libres de cables y cajas; el cableado va canalizado."],
ask:["¿Qué haces si suena la alarma del agente limpio?","¿Cómo se ve una batería de UPS dañada?"],
msg:"En el site, si suena la alarma, sal."},

{id:"C-60",cat:"ofi",t:"Instalación de cámaras y antenas en altura",min:5,nom:"NOM-009-STPS · NOM-017-STPS",miper:[78,2],areas:["ti","proteccion"],
obj:"Instalar o mantener cámaras, antenas y access points sin caídas de personas ni de herramienta.",
pts:["Todo trabajo arriba de 1.80 m requiere permiso, arnés y punto de anclaje.",
"Usa canasta, plataforma o escalera adecuada; nunca subas por la estructura de racks o postes sin protección.",
"Amarra herramientas y equipo para que no caigan.",
"Delimita el área de abajo mientras trabajas.",
"Coordina con Operaciones si instalas cerca de rutas de equipos o grúas."],
ask:["¿Qué permiso necesitas para instalar una cámara en poste?","¿Cómo evitas que caiga tu herramienta?"],
msg:"Arriba, anclado; abajo, delimitado."},

{id:"C-61",cat:"ofi",t:"Soporte de TI en patio y muelle",min:5,nom:"NOM-006-STPS · NOM-017-STPS",miper:[79,6],areas:["ti"],
obj:"Dar soporte a terminales móviles y equipos portuarios sin exponerse a atropellamientos.",
pts:["Antes de entrar a patio o muelle, avisa a Operaciones y usa chaleco, casco y botas.",
"Camina solo por rutas peatonales y pide que se detenga el equipo antes de acercarte.",
"Para revisar la terminal de una grúa o tracto, el operador debe apagar y bajar la carga.",
"No uses el celular mientras caminas en patio.",
"Al terminar, avisa a Operaciones que ya saliste del área."],
ask:["¿A quién avisas antes de entrar a patio?","¿Qué EPP necesitas en muelle?"],
msg:"En patio, primero la seguridad y luego el soporte."},

{id:"C-62",cat:"ofi",t:"Teletrabajo y guardias remotas",min:5,nom:"NOM-037-STPS · NOM-035-STPS",miper:[80,54],areas:["ti"],
obj:"Cuidar la salud y el descanso al trabajar desde casa o en guardias fuera de horario.",
pts:["Define un horario y respeta tu derecho a la desconexión.",
"Acondiciona un espacio con buena silla, luz y ventilación.",
"En guardias, acuerda con tu jefe cómo y cuándo te contactarán.",
"Haz pausas y no comas frente a la computadora.",
"Si sientes aislamiento o estrés, coméntalo con tu líder o con Capital Humano."],
ask:["¿Cómo te desconectas después de una guardia?","¿Tu espacio en casa es adecuado?"],
msg:"Trabajar en casa también requiere descanso."},

{id:"C-63",cat:"amb",t:"Aspectos ambientales: qué son y cuáles son los de tu área",min:7,nom:"Matriz TMAZ-SIG-AMB-R-11 · ISO 14001",asp:["Todos"],areas:[],
obj:"Que cada persona conozca los aspectos ambientales de su actividad y sus controles.",
pts:["Un aspecto ambiental es cualquier parte de tu trabajo que interactúa con el ambiente: consumir energía o combustible, generar residuos, emisiones, ruido o un posible derrame.",
"Cada aspecto puede causar un impacto: contaminar suelo, agua de mar o aire, afectar la salud, la fauna o agotar recursos.",
"La matriz R-11 evalúa cada aspecto; los que salen con 12 o más son aspectos ambientales significativos (AAS) y tienen controles obligatorios.",
"En TMAZ, los AAS se concentran en mantenimiento de grúas y equipos portuarios (derrames, residuos peligrosos e incendio), energía en reefers y sites, y agua en la purificadora.",
"Pregunta a tu supervisor o a Medio Ambiente cuáles son los aspectos y controles de tu actividad."],
ask:["¿Qué aspecto ambiental genera tu actividad?","¿Qué control aplicas para reducir su impacto?"],
msg:"Conocer tu aspecto es el primer paso para controlarlo."},

{id:"C-64",cat:"amb",t:"Consumo de energía en oficinas, almacenes y equipos",min:5,nom:"Matriz TMAZ-SIG-AMB-R-11 · Buenas prácticas de energía",asp:["CONSUMO DE ENERGÍA"],areas:[],
obj:"Reducir el consumo de energía, el aspecto que más aparece en la matriz ambiental de TMAZ.",
pts:["Apaga luces, aires acondicionados y equipos cuando no se usan, sobre todo al terminar el turno.",
"Mantén puertas y ventanas cerradas cuando el aire está encendido; ajústalo a 24 °C.",
"Desconecta cargadores y equipos que se quedan en espera.",
"Reporta lámparas encendidas de día, fugas de aire comprimido y equipos que se quedan prendidos.",
"En patio, evita dejar torres de iluminación encendidas en zonas sin operación."],
ask:["¿Qué equipo se queda encendido sin uso en tu área?","¿Quién apaga las luces al final del turno?"],
msg:"La energía que no usas, no la desperdicies."},

{id:"C-65",cat:"amb",t:"Energía en reefers y sites: aspectos significativos",min:5,nom:"Matriz TMAZ-SIG-AMB-R-11",asp:["CONSUMO DE ENERGÍA"],areas:["reefer","ti"],
obj:"Controlar el consumo eléctrico en reefers y cuartos de servidores, evaluados como aspectos significativos.",
pts:["Las pruebas PTI y la conexión de reefers son de los mayores consumos eléctricos de la terminal.",
"Registra cada conexión y desconexión para monitorear cuántas pruebas se hacen al mes.",
"Desconecta las unidades en cuanto termine la prueba o salga el contenedor.",
"En el site, mantén puertas cerradas, verifica voltaje, humedad y el estado de las baterías.",
"Reporta contactos o transformadores con calentamiento o fallas."],
ask:["¿Cuántas unidades reefer se quedan conectadas sin necesidad?","¿Dónde se registran las conexiones?"],
msg:"Prueba terminada, unidad desconectada."},

{id:"C-66",cat:"amb",t:"Emisiones de equipos y transportistas",min:5,nom:"NOM-045-SEMARNAT-2017 · Matriz R-11",asp:["EMISIONES MÓVILES","CONSUMO DE COMBUSTIBLES"],areas:[],
obj:"Reducir humo y gases de escape de equipos portuarios y unidades de transportistas.",
pts:["No dejes motores encendidos en espera: apágalos si vas a estar detenido varios minutos.",
"Reporta equipos que echan humo negro o azul; indican mala combustión o falla.",
"Cumple el mantenimiento preventivo: filtros y afinación reducen emisiones y consumo.",
"Pide a los transportistas apagar el motor mientras esperan en filas o en báscula.",
"Planea los recorridos para evitar viajes vacíos dentro de la terminal."],
ask:["¿Qué equipo de tu área echa más humo?","¿Cuánto tiempo pasa tu equipo encendido sin moverse?"],
msg:"Motor detenido, motor apagado."},

{id:"C-67",cat:"amb",t:"Residuos peligrosos en mantenimiento",min:5,nom:"LGPGIR · NOM-052-SEMARNAT-2005",asp:["GENERACIÓN RESIDUOS PELIGROSOS"],areas:["equipos","maestranza","obra"],
obj:"Manejar aceite usado, filtros, estopas y envases de químicos como residuos peligrosos, aspecto significativo en grúas.",
pts:["Aceite usado, filtros, estopas y trapos impregnados, baterías y envases de químicos son residuos peligrosos.",
"Usa lonas antiderrame y recipientes para el cambio de aceite y filtros.",
"Deposita cada residuo en su contenedor identificado, tapado y en buen estado.",
"Lleva los residuos al almacén temporal y regístralos en la bitácora de generación.",
"Nunca los mezcles con basura común ni los tires al drenaje o al piso."],
ask:["¿Dónde va una estopa con aceite?","¿Quién registra los residuos en la bitácora?"],
msg:"Residuo peligroso: separado, tapado y registrado."},

{id:"C-68",cat:"amb",t:"Almacén temporal de residuos peligrosos",min:5,nom:"LGPGIR y su Reglamento · NOM-052-SEMARNAT-2005",asp:["ALMACENAMIENTO DE RESIDUOS PELIGROSOS","POSIBLE DERRAME DE RESIDUOS PELIGROSOS"],areas:["almacenes","equipos"],
obj:"Mantener el almacén de residuos peligrosos en condiciones seguras y en cumplimiento legal.",
pts:["Los contenedores van cerrados, identificados con el tipo de residuo y la fecha de ingreso.",
"El almacén debe tener dique o charola de contención, techo, piso impermeable y señalización.",
"Separa residuos incompatibles y no almacenes más del tiempo permitido.",
"Ten a la mano extintor y kit antiderrame.",
"La entrega se hace solo a empresas autorizadas y con manifiesto."],
ask:["¿Qué datos lleva la etiqueta de un contenedor de residuos?","¿Quién autoriza la salida de residuos?"],
msg:"Lo que entra al almacén, sale con manifiesto."},

{id:"C-69",cat:"amb",t:"Residuos de manejo especial: chatarra, llantas y electrónicos",min:5,nom:"LGPGIR · NOM-161-SEMARNAT-2011",asp:["GENERACIÓN / ACOPIO RESIDUOS DE MANEJO ESPECIAL"],areas:["maestranza","obra","equipos"],
obj:"Separar y entregar correctamente residuos que no son peligrosos pero requieren manejo especial.",
pts:["Son de manejo especial: chatarra y piezas metálicas, llantas, madera, cables y equipo electrónico, escombro.",
"Acópialos en el área designada, separados por tipo.",
"No los dejes regados en patio: estorban, acumulan agua y generan fauna.",
"Las llantas y electrónicos se entregan a gestores autorizados, no a particulares.",
"Si un residuo está impregnado de aceite o químicos, ya es peligroso."],
ask:["¿Dónde se acopia la chatarra en tu área?","¿Una llanta usada qué tipo de residuo es?"],
msg:"Cada residuo a su lugar, y con gestor autorizado."},

{id:"C-70",cat:"amb",t:"Basura común y residuos en muelle",min:5,nom:"LGPGIR · Matriz R-11",asp:["GENERACIÓN / ACOPIO RESIDUOS SÓLIDOS URBANOS"],areas:[],
obj:"Evitar que la basura común termine en el mar o en patios.",
pts:["Usa los botes de basura y sepáralos según su color o letrero.",
"Botellas, bolsas y envolturas en el muelle se las lleva el viento al mar.",
"Lleva tu basura de regreso si no hay contenedor cerca.",
"Reporta contenedores llenos o sin tapa.",
"Reduce: usa termo o botella reutilizable en lugar de desechables."],
ask:["¿Dónde está el bote de basura más cercano al muelle?","¿Qué desechable podrías dejar de usar?"],
msg:"Lo que tiras al piso, el viento lo lleva al mar."},

{id:"C-71",cat:"amb",t:"Madera de estiba y embalaje",min:5,nom:"NOM-144-SEMARNAT-2017 · Matriz R-11",asp:["CONSUMO DE MADERA","GENERACIÓN / ACOPIO RESIDUOS DE MANEJO ESPECIAL"],areas:["naves","acero","cfs"],
obj:"Usar, reutilizar y desechar correctamente la madera de estiba y embalaje.",
pts:["La madera de embalaje de importación debe traer el sello fitosanitario (IPPC); repórtala si no lo tiene.",
"Reutiliza durmientes y polines en buen estado antes de pedir madera nueva.",
"Acopia la madera dañada en el área designada, sin clavos expuestos.",
"No quemes madera ni la regales sin autorización.",
"Madera con aceite o químicos se maneja como residuo peligroso."],
ask:["¿Cómo se ve el sello IPPC en la madera?","¿Dónde se acopia la madera dañada?"],
msg:"Madera que sirve se reutiliza; la que no, a su lugar."},

{id:"C-72",cat:"amb",t:"Derrames en mantenimiento de grúas y equipos",min:5,nom:"Manual TMAZ-SIG-AMB-MAN-09 · LGPGIR",asp:["POSIBLE DERRAME DE MATERIALES PELIGROSOS","POSIBLE DERRAME DE RESIDUOS PELIGROSOS"],areas:["equipos","maestranza"],
obj:"Prevenir y contener derrames de aceite e hidráulico, evaluados como aspectos significativos en mantenimiento.",
pts:["Antes de iniciar, coloca charolas, tarimas de contención o lonas antiderrame bajo el equipo.",
"Revisa mangueras hidráulicas y conexiones: una manguera dañada es un derrame en espera.",
"Ten aserrín o kit antiderrame a la mano en el taller y en el punto de trabajo.",
"El material de limpieza contaminado se dispone como residuo peligroso.",
"Protege registros pluviales cercanos: descargan al mar."],
ask:["¿Qué contención usas en un cambio de aceite?","¿Hacia dónde escurre un derrame en tu taller?"],
msg:"Charola puesta antes de aflojar."},

{id:"C-73",cat:"amb",t:"Incendio en equipos portuarios",min:5,nom:"Plan interno de protección civil · Manual TMAZ-SIG-AMB-MAN-09 · NOM-002-STPS",asp:["POSIBLE INCENDIO / EXPLOSIÓN"],areas:["equipos"],
obj:"Prevenir y responder a incendios en grúas y equipos portuarios, aspecto significativo de la matriz.",
pts:["Cumple el programa de mantenimiento preventivo: fugas de hidráulico sobre partes calientes inician incendios.",
"Revisa mensualmente el extintor del equipo y el sistema automático de supresión de equipos mayores.",
"Conoce dónde está el cortacorriente para desenergizar el equipo.",
"Ante humo o fuego: detén, baja la carga si es seguro, corta energía, evacúa y avisa a la brigada.",
"Reporta cualquier olor a quemado, chispa o calentamiento anormal."],
ask:["¿Dónde está el cortacorriente de tu equipo?","¿Cuándo se revisó el extintor de tu equipo?"],
msg:"Fuga sobre caliente es fuego: repórtala."},

{id:"C-74",cat:"amb",t:"Consumo de agua y purificadora",min:5,nom:"NOM-127-SSA1 · Matriz R-11",asp:["CONSUMO DE AGUA","POSIBLE DERRAME DE AGUA"],areas:["obra"],
obj:"Cuidar el agua en la terminal y reducir el desperdicio en la purificadora.",
pts:["Reporta fugas en llaves, mangueras, sanitarios y tuberías.",
"Cierra la llave mientras te enjabonas o lavas utensilios.",
"Usa hidrolavadora o cubeta en lugar de manguera abierta para limpiar.",
"En la purificadora, el agua de rechazo puede aprovecharse para limpieza o riego.",
"No dejes mangueras abiertas sin supervisión."],
ask:["¿Qué fuga de agua has visto en tu área?","¿Para qué podría usarse el agua de rechazo?"],
msg:"Cada gota cuenta, más en Sinaloa."},

{id:"C-75",cat:"amb",t:"Aguas residuales y lavado de equipos",min:5,nom:"NOM-002-SEMARNAT-1996 · Matriz R-11",asp:["VERTIDO DE AGUAS RESIDUALES"],areas:["equipos","almacenes"],
obj:"Evitar que agua con grasas, lodos o químicos llegue al drenaje o al mar.",
pts:["Lava equipos solo en el área designada, con trampa de grasas o sistema de captación.",
"No viertas aceite, solventes ni pintura al drenaje o a las coladeras.",
"Usa detergentes biodegradables autorizados.",
"Reporta coladeras tapadas o trampas de grasa llenas.",
"El agua de lluvia del patio llega al mar: mantén el piso libre de aceite."],
ask:["¿Dónde está el área de lavado de equipos?","¿Qué pasa con el agua que cae en una coladera de patio?"],
msg:"Por la coladera solo agua limpia."},

{id:"C-76",cat:"amb",t:"Ruido, polvo y olores hacia la ciudad",min:5,nom:"NOM-081-SEMARNAT-1994 · Matriz R-11",asp:["GENERACIÓN RUIDO Y VIBRACIONES","GENERACIÓN DE POLVOS","GENERACIÓN OLORES"],areas:["naves","equipos"],
obj:"Reducir las molestias a los vecinos de Mazatlán por ruido, polvo y olores de la operación.",
pts:["La terminal está junto a la ciudad: lo que hacemos se oye y se respira afuera.",
"Evita golpes innecesarios de spreader y bocinazos, sobre todo de noche.",
"Durante descargas de granel, controla la altura de caída y la velocidad del viento.",
"Barre o riega patios con polvo acumulado según el procedimiento.",
"Reporta mercancías o residuos que generen olores fuertes."],
ask:["¿Qué ruido de tu operación se escucha fuera de la terminal?","¿Cómo se controla el polvo en la descarga de granel?"],
msg:"Buen vecino: menos ruido, menos polvo."},

{id:"C-77",cat:"amb",t:"Almacenamiento y manejo de sustancias químicas",min:5,nom:"NOM-005-STPS · NOM-018-STPS · Matriz R-11",asp:["ALMACENAMIENTO DE SUSTANCIAS QUÍMICAS PELIGROSAS","MANIPULACIÓN DE SUSTANCIAS QUÍMICAS PELIGROSAS"],areas:["almacenes","maestranza","equipos"],
obj:"Almacenar lubricantes, solventes y químicos sin derrames, incendios ni mezclas peligrosas.",
pts:["Almacena químicos en el área designada, con contención y ventilación.",
"Respeta la compatibilidad: no juntes oxidantes con combustibles ni ácidos con bases.",
"Mantén cada recipiente cerrado y etiquetado.",
"Trasvasa solo con embudo o bomba, sobre charola.",
"Lleva un inventario y usa primero lo más antiguo."],
ask:["¿Dónde se almacenan los lubricantes en tu área?","¿Qué químicos no deben estar juntos?"],
msg:"Químico guardado, etiquetado y contenido."},

{id:"C-78",cat:"amb",t:"Fugas de gases refrigerantes y gas LP",min:5,nom:"NOM-002-STPS · Matriz R-11",asp:["POSIBLE FUGA DE GASES"],areas:["reefer","maestranza"],
obj:"Prevenir y atender fugas de refrigerantes y gas LP que dañan la capa de ozono o pueden incendiarse.",
pts:["Los refrigerantes de reefers y aires acondicionados no se liberan al ambiente.",
"Solo técnicos capacitados recuperan y recargan refrigerante, con equipo de recuperación.",
"Si hueles gas LP, no enciendas ni apagues interruptores: ventila y aléjate.",
"Revisa conexiones de cilindros y tanques en cada uso.",
"Reporta toda fuga a Mantenimiento y a Medio Ambiente."],
ask:["¿Qué haces si hueles gas LP?","¿Quién está autorizado para recargar refrigerante?"],
msg:"El gas que se fuga no regresa."},

{id:"C-79",cat:"amb",t:"Plagas en almacenes y áreas comunes",min:5,nom:"NOM-256-SSA1-2012 · Matriz R-11",asp:["POSIBLE GENERACIÓN / IDENTIFICACIÓN DE PLAGA"],areas:["almacenes","cfs"],
obj:"Prevenir plagas que dañan mercancía y salud.",
pts:["No dejes restos de comida en almacenes, oficinas ni muelle.",
"Mantén cerradas puertas y cortinas de almacenes cuando no hay maniobra.",
"Reporta excremento, nidos, mercancía roída o insectos.",
"No muevas trampas ni cebos del programa de control de plagas.",
"Mercancía con plaga se aísla y se avisa a Medio Ambiente."],
ask:["¿Has visto señales de roedores en tu área?","¿Dónde comes durante el turno?"],
msg:"Sin comida, sin plaga."},

{id:"C-80",cat:"amb",t:"Papel y oficina sustentable",min:5,nom:"Matriz R-11",asp:["CONSUMO DE PAPEL","CONSUMO DE ENERGÍA"],areas:["ti"],
obj:"Reducir el consumo de papel y energía en oficinas.",
pts:["Imprime solo lo necesario y a doble cara.",
"Usa formatos digitales y firmas electrónicas cuando estén autorizados.",
"Reutiliza hojas impresas de un lado como borrador.",
"Separa el papel para reciclaje.",
"Apaga monitores e impresoras al salir."],
ask:["¿Qué formato podrías hacer en digital?","¿Dónde se junta el papel para reciclar?"],
msg:"El mejor papel es el que no se imprime."},

{id:"C-81",cat:"amb",t:"Fauna marina y aves en la terminal",min:5,nom:"LGEEPA · Matriz R-11",asp:["Detrimento de la biodiversidad"],areas:["naves","cabotaje"],
obj:"Proteger la fauna marina y las aves que llegan a la dársena y al muelle.",
pts:["No tires nada al agua: plásticos, cabos o redes atrapan aves, tortugas y peces.",
"No alimentes aves ni lobos marinos: se acostumbran y se acercan a zonas de riesgo.",
"Reporta fauna herida o atrapada; no intentes manipularla.",
"Un derrame pequeño en el muelle puede afectar a la fauna: contén y reporta.",
"Recoge cabos, flejes y plásticos sueltos al terminar la maniobra."],

<script>
/* Generador mínimo de .docx sin librerías (ZIP sin compresión + WordprocessingML). */
(function(){
'use strict';
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zip(files){
  const enc=new TextEncoder(), parts=[], cen=[]; let off=0;
  for(const f of files){
    const name=enc.encode(f.name), data=typeof f.data==='string'?enc.encode(f.data):f.data, crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),name);
    off+=30+name.length+data.length;
  }
  const csize=cen.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,csize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
const x=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function p(runs,o={}){return `<w:p><w:pPr>${o.style?`<w:pStyle w:val="${o.style}"/>`:''}${o.pb?'<w:pageBreakBefore/>':''}${o.shd?`<w:shd w:val="clear" w:color="auto" w:fill="${o.shd}"/>`:''}${o.border?`<w:pBdr><w:left w:val="single" w:sz="36" w:space="8" w:color="${o.border}"/></w:pBdr>`:''}${o.bottom?`<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="${o.bsp||1}" w:color="${o.bottom}"/></w:pBdr>`:''}<w:spacing w:before="${o.before??0}" w:after="${o.after??80}"/>${o.ind?`<w:ind w:left="${o.ind}" w:hanging="300"/>`:''}${o.jc?`<w:jc w:val="${o.jc}"/>`:''}</w:pPr>${Array.isArray(runs)?runs.join(''):runs}</w:p>`;}
function cell(content,w,o={}){return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>${o.span?`<w:gridSpan w:val="${o.span}"/>`:''}${o.fill?`<w:shd w:val="clear" w:color="auto" w:fill="${o.fill}"/>`:''}<w:vAlign w:val="center"/></w:tcPr>${content}</w:tc>`;}
function table(rows,widths,o={}){const b=o.noBorder?'none':'single';
  return `<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/><w:tblBorders>${['top','left','bottom','right','insideH','insideV'].map(s=>`<w:${s} w:val="${b}" w:sz="4" w:color="${BR}"/>`).join('')}</w:tblBorders><w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="100" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>${widths.map(w=>`<w:gridCol w:w="${w}"/>`).join('')}</w:tblGrid>${rows.join('')}</w:tbl>`;}

  body+=p(' ',{bottom:R,after:160});
  const w3=[3300,3300,3300];
  body+=table([
    tr([cell(kv('Código',c.id),w3[0]),cell(kv('Categoría',catName),w3[1]),cell(kv('Duración',c.min+' min'),w3[2])],380),

  body+=p([run('Charla: ',{b:1,sz:19}),run(c.id+' · '+c.t+'    ',{sz:19}),run('Fecha: ',{b:1,sz:19}),run(m.fechaTxt+'    ',{sz:19}),run('Turno: ',{b:1,sz:19}),run(m.turno+'    ',{sz:19}),run('Área: ',{b:1,sz:19}),run(m.area,{sz:19})],{after:160});
  const aw=[500,3600,1700,2000,2100];

  body+=table(rows,aw)+p(' ',{after:0});
  const sig=(name,label)=>p(run(name||' ',{sz:19}),{before:700,after:0,jc:'center',bottom:'14231A'})+p(run(label,{b:1,sz:19}),{jc:'center'});
  body+=table([tr([cell(sig(m.who,'Nombre y firma de quien imparte'),4950),cell(sig('','Vo. Bo. HSE'),4950)])],[4950,4950],{noBorder:true});

  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body}<w:sectPr><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="1000" w:right="1170" w:bottom="1000" w:left="1170" w:header="500" w:footer="500" w:gutter="0"/></w:sectPr></w:body></w:document>`;

<script>
(function(){
'use strict';
const CATS={
  op:{n:'Operación portuaria',v:'--c-op',hex:'#0066B3'},
  seg:{n:'Seguridad',v:'--c-seg',hex:'#B4521A'},
  sal:{n:'Salud',v:'--c-sal',hex:'#178A53'},
  eme:{n:'Emergencias',v:'--c-eme',hex:'#C81E36'},
  amb:{n:'Ambiental',v:'--c-amb',hex:'#1F7A6A'},
  nat:{n:'Eventos naturales',v:'--c-nat',hex:'#5B5FA8'},

};
const DATA=(window.CHARLAS||[]);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let cat='all', area='all', current=null;
const AREAS={naves:'Naves',cabotaje:'Cabotaje',autos:'Autos',acero:'Acero',contenedores:'Contenedores',deposito:'Depósito, Gate y báscula',cfs:'CFS',almacenes:'Almacenes',reefer:'Reefer',maestranza:'Maestranza',equipos:'Equipos portuarios',obra:'Obra civil',proteccion:'Protección',ti:'Oficinas y TI'};
