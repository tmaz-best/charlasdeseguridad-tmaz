/* tema */
const root=document.documentElement;
function applyTheme(t){ if(t) root.setAttribute('data-theme',t); else root.removeAttribute('data-theme');
  const dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches; $('#themeBtn').textContent=dark?'☀':'☾'; }
applyTheme(store.get('tmaz-charlas-theme'));
$('#themeBtn').onclick=()=>{const dark=root.getAttribute('data-theme')?root.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  const t=dark?'light':'dark'; store.set('tmaz-charlas-theme',t); applyTheme(t);};

function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2400);}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

/* charla del día: rota por fecha */
function renderToday(){
  if(!DATA.length) return;
  const d=new Date(); const n=Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
  const c=DATA[n%DATA.length]; const k=CATS[c.cat]||CATS.seg;
  $('#today').innerHTML=`<div><div class="eyebrow">Charla del día · ${d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})}</div>

}

async function logoBytes(){
  try{ if(LOGO_URL.startsWith('data:')){const b=atob(LOGO_URL.split(',')[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
    const r=await fetch(LOGO_URL); return new Uint8Array(await r.arrayBuffer()); }catch(e){return null;}
}
async function downloadWord(c){
  const m=meta(); const name=fileName(c,m,'docx');
  const blob=window.buildCharlaDocx(c,m,(CATS[c.cat]||CATS.seg).n,await logoBytes(),{miper:(c.miper||[]).filter(n=>MIPER[n]).map(n=>'#'+n+' '+MIPER[n]),asp:c.asp||[]});

    const dl=await DL;

  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click();

})();

<script>
/* Generador mínimo de PDF sin librerías: texto Helvetica (WinAnsi), rectángulos, líneas e imágenes JPEG. Coordenadas desde arriba a la izquierda, en puntos. */
(function(){
'use strict';
const WR=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
const WB=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
const SPECIAL={'€':0x80,'…':0x85,'‘':0x91,'’':0x92,'“':0x93,'”':0x94,'•':0x95,'–':0x96,'—':0x97};
function clean(s){ return String(s??'').replace(/→/g,'->').replace(/[ -​]/g,' ').replace(/\r/g,''); }
function code(ch){ const c=ch.charCodeAt(0); if(c<256) return c; if(SPECIAL[ch]) return SPECIAL[ch]; const b=ch.normalize('NFD')[0]; return b&&b.charCodeAt(0)<128?b.charCodeAt(0):63; }
function cw(ch,bold){ const t=bold?WB:WR; let c=ch.charCodeAt(0);
  if(c>=32&&c<127) return t[c-32];
  if(ch==='¿') return 611; if(ch==='¡') return 333; if(ch==='·') return 278; if(ch==='•') return 350; if(ch==='—') return 1000; if(ch==='–') return 556;
  const b=ch.normalize('NFD')[0]; c=b?b.charCodeAt(0):0; return (c>=32&&c<127)?t[c-32]:556; }
function width(s,size,bold){ s=clean(s); let w=0; for(const ch of s) w+=cw(ch,bold); return w*size/1000; }
function enc(s){ s=clean(s); let o=''; for(const ch of s){ const c=code(ch); const x=String.fromCharCode(c); o+=(x==='('||x===')'||x==='\\')?'\\'+x:x; } return o; }
function rgb(hex){ hex=(hex||'000000').replace('#',''); return [0,2,4].map(i=>(parseInt(hex.substr(i,2),16)/255).toFixed(3)).join(' '); }
function n(v){ return (Math.round(v*100)/100).toString(); }

window.PDFDoc=function(){
  const W=612,H=792; const pages=[]; const images=[]; let cur=null;
  const api={W,H,
    addPage(){ cur={ops:[]}; pages.push(cur); return api; },
    get pageCount(){ return pages.length; },
    setPage(i){ cur=pages[i]; },
    width,
    wrap(s,maxW,size,bold){ const out=[]; clean(s).split('\n').forEach(par=>{ const words=par.split(/\s+/).filter(Boolean); let line='';
        words.forEach(w=>{ const t=line?line+' '+w:w; if(width(t,size,bold)<=maxW||!line) line=t; else { out.push(line); line=w; }
          while(width(line,size,bold)>maxW&&line.length>1){ let k=line.length; while(k>1&&width(line.slice(0,k),size,bold)>maxW) k--; out.push(line.slice(0,k)); line=line.slice(k); } });
        out.push(line); }); return out; },
    text(x,y,s,o={}){ const size=o.size||10, f=o.bold?'F2':'F1'; let tx=x;
      if(o.align==='center') tx=x-width(s,size,o.bold)/2; else if(o.align==='right') tx=x-width(s,size,o.bold);
      cur.ops.push(`BT ${rgb(o.color)} rg /${f} ${n(size)} Tf ${n(tx)} ${n(H-y-size*0.8)} Td (${enc(s)}) Tj ET`); },
    rect(x,y,w,h,o={}){ let s='q '; if(o.fill) s+=`${rgb(o.fill)} rg `; if(o.stroke) s+=`${rgb(o.stroke)} RG ${n(o.lw||0.6)} w `;
      s+=`${n(x)} ${n(H-y-h)} ${n(w)} ${n(h)} re ${o.fill&&o.stroke?'B':o.fill?'f':'S'} Q`; cur.ops.push(s); },
    line(x1,y1,x2,y2,o={}){ cur.ops.push(`q ${rgb(o.color||'000000')} RG ${n(o.lw||0.6)} w ${n(x1)} ${n(H-y1)} m ${n(x2)} ${n(H-y2)} l S Q`); },
    image(img,x,y,w,h){ let i=images.indexOf(img); if(i<0){ images.push(img); i=images.length-1; } cur.ops.push(`q ${n(w)} 0 0 ${n(h)} ${n(x)} ${n(H-y-h)} cm /Im${i} Do Q`); },
    save(){
      const parts=[]; let len=0; const offs=[];
      const push=d=>{ const b=typeof d==='string'?bin(d):d; parts.push(b); len+=b.length; };
      const bin=s=>{ const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i)&255; return u; };
      const nPages=pages.length, nImg=images.length;
      // ids: 1 catalog, 2 pages, 3 F1, 4 F2, images 5.., then page/content pairs
      const imgId=i=>5+i, pageId=i=>5+nImg+i*2, contId=i=>6+nImg+i*2, total=5+nImg+nPages*2;
      const obj=(id,body)=>{ offs[id]=len; push(`${id} 0 obj\n`); if(typeof body==='string') push(body); else body.forEach(push); push('\nendobj\n'); };
      push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
      obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
      obj(2,`<< /Type /Pages /Kids [${pages.map((_,i)=>pageId(i)+' 0 R').join(' ')}] /Count ${nPages} >>`);
      obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
      obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
      images.forEach((im,i)=>obj(imgId(i),[`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`,im.bytes,'\nendstream']));
      const xo=images.map((_,i)=>`/Im${i} ${imgId(i)} 0 R`).join(' ');
      pages.forEach((p,i)=>{
        obj(pageId(i),`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> /XObject << ${xo} >> >> /Contents ${contId(i)} 0 R >>`);
        const c=p.ops.join('\n'); obj(contId(i),[`<< /Length ${c.length} >>\nstream\n`,c,'\nendstream']);
      });
      const xref=len; let x=`xref\n0 ${total}\n0000000000 65535 f \n`; for(let i=1;i<total;i++) x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
      push(x+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
      const out=new Uint8Array(len); let o=0; parts.forEach(b=>{ out.set(b,o); o+=b.length; }); return out;
    }
  };
  return api;
};
/* dataURL JPEG -> {bytes,w,h} */
window.jpegFromDataURL=function(url,w,h){ const b=atob(url.split(',')[1]); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return {bytes:u,w,h}; };
})();

</script>
<script>
/* Registro de charla impartida: asistentes con firma, fotos de evidencia e informe PDF. Usa window.TMAZ (index.html) y window.PDFDoc (pdfgen.js). */
(function(){
'use strict';
const T=window.TMAZ; if(!T) return;
const {DATA,CATS,MIPER,AREAS,esc,toast,store}=T;
const $=s=>document.querySelector(s);
const KEY='tmaz-charlas-registro', MAX_FOTOS=6;
const pad2=v=>String(v).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());};
const nowHM=()=>{const d=new Date();return pad2(d.getHours())+':'+pad2(d.getMinutes());};
const turnoAuto=()=>{const h=new Date().getHours();return h>=7&&h<15?'Matutino':h>=15&&h<23?'Vespertino':'Nocturno';};

function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); return s&&s.asist?s:null; }catch(e){ return null; } }
function save(){ if(!R) return; const base={...R,fotos:[]};
  try{ localStorage.setItem(KEY,JSON.stringify({...R,fotos:fotosMem})); }
  catch(e){ try{ localStorage.setItem(KEY,JSON.stringify(base)); }catch(e2){} } }

/* ---------- estilos y estructura ---------- */

/* ---------- firma ---------- */
let sigCb=null, drawn=false;
const cv=$('#sigC'), ctx=cv.getContext('2d');
function sizeCanvas(){ const r=cv.getBoundingClientRect(), d=Math.max(1,window.devicePixelRatio||1); cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); ctx.setTransform(d,0,0,d,0,0); ctx.lineWidth=2.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0B1F14'; ctx.fillStyle='#fff'; ctx.fillRect(0,0,r.width,r.height); drawn=false; }
let last=null;
const pt=e=>{ const r=cv.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; };
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); last=pt(e); ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,7); ctx.fillStyle='#0B1F14'; ctx.fill(); drawn=true; });
cv.addEventListener('pointermove',e=>{ if(!last) return; const p=pt(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; drawn=true; });
['pointerup','pointercancel','pointerleave'].forEach(t=>cv.addEventListener(t,()=>{ last=null; }));
function openSig(title,sub,cb){ sigCb=cb; $('#sigT').textContent=title; $('#sigS').textContent=sub||''; $('#sigD').showModal(); requestAnimationFrame(sizeCanvas); }
$('#sigClr').onclick=sizeCanvas;
$('#sigNo').onclick=()=>$('#sigD').close();
$('#sigOk').onclick=()=>{ if(!drawn){ toast('Firma en el recuadro antes de guardar'); return; }
  // recorta y reduce a JPEG
  const out=document.createElement('canvas'); out.width=600; out.height=Math.round(600*cv.height/cv.width);
  const o=out.getContext('2d'); o.fillStyle='#fff'; o.fillRect(0,0,out.width,out.height); o.drawImage(cv,0,0,out.width,out.height);
  const data={url:out.toDataURL('image/jpeg',0.85),w:out.width,h:out.height,t:new Date().toISOString()};
  $('#sigD').close(); sigCb&&sigCb(data); };

/* ---------- fotos ---------- */
function readPhoto(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ const max=1400, k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); res({url:c.toDataURL('image/jpeg',0.78),w:c.width,h:c.height}); }; im.onerror=rej; im.src=fr.result; }; fr.onerror=rej; fr.readAsDataURL(file); }); }
async function addFiles(files){ for(const f of [...files]){ if(fotosMem.length>=MAX_FOTOS){ toast('Máximo '+MAX_FOTOS+' fotos'); break; } try{ fotosMem.push(await readPhoto(f)); }catch(e){ toast('No se pudo leer una foto'); } } save(); render(); }
$('#camIn').onchange=e=>{ addFiles(e.target.files); e.target.value=''; };
$('#galIn').onchange=e=>{ addFiles(e.target.files); e.target.value=''; };

/* ---------- vista ---------- */
let confirmClear=false;
function charla(){ return DATA.find(x=>x.id===R.id)||DATA[0]; }
function render(){
  const c=charla(); $('#regT').textContent=c.id+' · '+c.t;
  const firmados=R.asist.filter(a=>a.sig).length;
  $('#regBody').innerHTML=`
  <section class="sec"><h3><span class="n">1</span>Datos de la charla</h3>
    <label>Charla<select id="rCh">${DATA.map(x=>`<option value="${x.id}"${x.id===R.id?' selected':''}>${esc(x.id+' · '+x.t)}</option>`).join('')}</select></label>
    <div class="g3"><label>Fecha<input type="date" id="rF" value="${esc(R.fecha)}"></label><label>Hora de inicio<input type="time" id="rH" value="${esc(R.hora)}"></label><label>Hora de término<input type="time" id="rHF" value="${esc(R.horaFin)}"></label></div>
    <div class="g3"><label>Turno<select id="rT">${['Matutino','Vespertino','Nocturno','Mixto'].map(t=>`<option${t===R.turno?' selected':''}>${t}</option>`).join('')}</select></label><label>Área / cuadrilla<input id="rA" value="${esc(R.area)}" placeholder="Ej. Muelle 2, Patio"></label><label>Lugar<input id="rL" value="${esc(R.lugar||'')}" placeholder="Ej. Caseta de muelle 3"></label></div>
    <div class="g2"><label>Impartida por<input id="rW" value="${esc(R.who)}" placeholder="Nombre completo"></label><label>Puesto<input id="rP" value="${esc(R.puesto)}" placeholder="Ej. Supervisor de operaciones"></label></div>
    <p class="hint">La fecha y la hora se llenan solas con el momento actual; cámbialas si la charla fue otro día.</p>
  </section>
  <section class="sec"><h3><span class="n">2</span>Asistentes y firmas</h3>
    <div class="add"><label class="nmf">Nombre completo<input id="aN" placeholder="Nombre y apellidos" autocomplete="off" list="aList"></label><label>No. empleado<input id="aE" inputmode="numeric"></label><label>Empresa / área<input id="aEm" placeholder="TMAZ, contratista…"></label><button class="btn primary" id="aAdd" type="button">+ Agregar</button></div>
    <datalist id="aList">${roster().map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <div class="stat"><span class="pill">${R.asist.length} asistente${R.asist.length===1?'':'s'}</span><span class="pill ${firmados===R.asist.length&&R.asist.length?'ok':firmados<R.asist.length?'no':''}">${firmados} de ${R.asist.length} firmados</span>${lastList().length&&!R.asist.length?`<button class="btn sm" id="aPrev" type="button">Usar la lista de la charla anterior (${lastList().length})</button>`:''}</div>
    <div class="att">${R.asist.map((a,i)=>`<div class="ar"><span class="num">${i+1}</span><span class="nm">${esc(a.n)}<small>${esc([a.num,a.emp].filter(Boolean).join(' · ')||'Sin número ni área')}</small></span>
      <button class="sigb ${a.sig?'ok':''}" type="button" data-sig="${i}" aria-label="Firma de ${esc(a.n)}">${a.sig?`<img src="${a.sig.url}" alt="Firma">`:'Toca para firmar'}</button>
      <button class="del" type="button" data-del="${i}" aria-label="Quitar a ${esc(a.n)}">✕</button></div>`).join('')||'<p class="hint">Agrega a cada asistente y pásale el celular para que firme.</p>'}</div>
  </section>
  <section class="sec"><h3><span class="n">3</span>Evidencia fotográfica</h3>
    <div class="row"><button class="btn primary" id="fCam" type="button">📷 Tomar foto</button><button class="btn" id="fGal" type="button">Subir de galería</button><span class="hint">${fotosMem.length} de ${MAX_FOTOS}</span></div>
    <div class="fotos">${fotosMem.map((f,i)=>`<div class="ft"><img src="${f.url}" alt="Foto ${i+1}"><button type="button" data-fdel="${i}" aria-label="Quitar foto">✕</button></div>`).join('')}</div>
  </section>
  <section class="sec"><h3><span class="n">4</span>Comentarios y firma de quien imparte</h3>
    <label>Comentarios, dudas o acuerdos del grupo<textarea id="rC" placeholder="Ej. Se acordó revisar el kit antiderrames del taller.">${esc(R.coment)}</textarea></label>
    <div class="g2" style="align-items:end"><div><div class="hint" style="font-weight:800;margin-bottom:4px">Firma de quien imparte</div><button class="sigb ${R.inst?'ok':''}" type="button" id="iSig" style="height:70px">${R.inst?`<img src="${R.inst.url}" alt="Firma" style="max-height:64px">`:'Toca para firmar'}</button></div>
    <div class="hint">Se incluye en el informe con la fecha y hora de cada firma.</div></div>
  </section>
  ${confirmClear?`<div class="confirm">Se borran asistentes, firmas y fotos de este registro. <span class="row"><button class="btn sm red" id="clrYes" type="button">Sí, borrar</button><button class="btn sm" id="clrNo" type="button">Cancelar</button></span></div>`:''}`;
  $('#regFoot').innerHTML=`<button class="btn" id="rClear" type="button">Nuevo registro</button><button class="btn primary" id="rPdf" type="button">⬇ Generar informe PDF</button>`;
  bind();
}
function roster(){ try{ return JSON.parse(localStorage.getItem('tmaz-charlas-roster')||'[]'); }catch(e){ return []; } }
function lastList(){ try{ return JSON.parse(localStorage.getItem('tmaz-charlas-lastlist')||'[]'); }catch(e){ return []; } }
function bind(){
  const v=(id,k,keep)=>{ const el=$(id); el.addEventListener('input',()=>{ R[k]=el.value; if(keep) store.set(keep,el.value); save(); }); };
  v('#rF','fecha'); v('#rH','hora'); v('#rHF','horaFin'); v('#rT','turno'); v('#rA','area','tmaz-charlas-area'); v('#rL','lugar'); v('#rW','who','tmaz-charlas-instructor'); v('#rP','puesto','tmaz-charlas-puesto'); v('#rC','coment');
  $('#rT').addEventListener('change',()=>{ R.turno=$('#rT').value; save(); });
  $('#rCh').addEventListener('change',e=>{ R.id=e.target.value; save(); render(); });
  const add=()=>{ const n=$('#aN').value.trim(); if(!n){ toast('Escribe el nombre del asistente'); $('#aN').focus(); return; }
    R.asist.push({n,num:$('#aE').value.trim(),emp:$('#aEm').value.trim(),sig:null}); const ro=roster(); if(!ro.includes(n)){ ro.unshift(n); try{ localStorage.setItem('tmaz-charlas-roster',JSON.stringify(ro.slice(0,300))); }catch(e){} }
    save(); render(); const i=R.asist.length-1; openSig('Firma de '+n,'Asistencia a: '+charla().t,d=>{ R.asist[i].sig=d; save(); render(); }); };
  $('#aAdd').onclick=add; ['#aN','#aE','#aEm'].forEach(s=>$(s).addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); add(); } }));
  const prev=$('#aPrev'); if(prev) prev.onclick=()=>{ R.asist=lastList().map(a=>({...a,sig:null})); save(); render(); toast('Lista cargada: faltan las firmas'); };
  document.querySelectorAll('[data-sig]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.sig, a=R.asist[i]; openSig('Firma de '+a.n,'Asistencia a: '+charla().t,d=>{ R.asist[i].sig=d; save(); render(); }); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ R.asist.splice(+b.dataset.del,1); save(); render(); });
  document.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=()=>{ fotosMem.splice(+b.dataset.fdel,1); save(); render(); });
  $('#fCam').onclick=()=>$('#camIn').click(); $('#fGal').onclick=()=>$('#galIn').click();
  $('#iSig').onclick=()=>openSig('Firma de quien imparte',R.who||'',d=>{ R.inst=d; save(); render(); });
  $('#rClear').onclick=()=>{ confirmClear=true; render(); $('#regBody').lastElementChild.scrollIntoView({behavior:'smooth',block:'center'}); };
  const y=$('#clrYes'); if(y){ y.onclick=()=>{ const id=R.id; R=blank(id); fotosMem=[]; confirmClear=false; save(); render(); toast('Registro nuevo'); }; $('#clrNo').onclick=()=>{ confirmClear=false; render(); }; }
  $('#rPdf').onclick=makePdf;
}

window.openRegistro=function(id){
  const d=load();
  if(d){ R=d; fotosMem=d.fotos||[]; if(id&&id!==R.id&&!R.asist.length&&!fotosMem.length) R.id=id; else if(id&&id!==R.id){ R.id=id; toast('Se conservaron los asistentes del registro abierto'); } }
  else { R=blank(id||DATA[0].id); fotosMem=[]; }
  if(!R.fecha) R.fecha=today();
  confirmClear=false; render(); const dl=$('#regDlg'); if(!dl.open) dl.showModal(); $('#regBody').scrollTop=0;
};
$('#regClose').onclick=()=>$('#regDlg').close();

/* ---------- informe PDF ---------- */
async function logoImg(){ return new Promise(res=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas'); c.width=im.naturalWidth; c.height=im.naturalHeight; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0); try{ res({url:c.toDataURL('image/jpeg',0.9),w:c.width,h:c.height}); }catch(e){ res(null); } }; im.onerror=()=>res(null); im.src=T.LOGO_URL; }); }
async function makePdf(){
  const c=charla();
  const miss=[]; if(!R.who) miss.push('quién imparte'); if(!R.asist.length) miss.push('asistentes');
  if(miss.length){ toast('Falta: '+miss.join(' y ')); return; }
  const sinFirma=R.asist.filter(a=>!a.sig).length;
  const btn=$('#rPdf'); btn.disabled=true; btn.textContent='Generando…';
  try{
    const doc=PDFDoc(); const W=doc.W, M=40, CW=W-2*M, G='0B4A2C', G2='13663E', RED='E3233F', MU='4E6356', BR='A9BEAE', LT='EAF1EB';
    const J=d=>jpegFromDataURL(d.url,d.w,d.h);
    const logo=await logoImg(); const L=logo?J(logo):null;
    let y=0;
    const newPage=()=>{ doc.addPage(); y=M; };
    const need=h=>{ if(y+h>doc.H-50){ newPage(); return true; } return false; };
    const h2=t=>{ need(30); y+=8; doc.text(M,y,t,{size:11.5,bold:1,color:G2}); y+=16; doc.line(M,y,M+CW,y,{color:'D5E0D7',lw:1}); y+=8; };
    const para=(t,size=9.5,o={})=>{ doc.wrap(t,CW-(o.ind||0),size,o.bold).forEach(l=>{ need(size+4); doc.text(M+(o.ind||0),y,l,{size,bold:o.bold,color:o.color}); y+=size+3.5; }); };
    newPage();
    // encabezado
    doc.rect(M,y,CW,66,{fill:G}); doc.rect(M,y,108,66,{fill:'FFFFFF'});
    if(L){ const h=54, w=Math.min(96,h*L.w/L.h); doc.image(L,M+(108-w)/2,y+6,w,w*L.h/L.w); } else doc.text(M+54,y+24,'tmaz',{size:20,bold:1,color:G,align:'center'});
    doc.text(M+120,y+10,'TERMINAL MARÍTIMA MAZATLÁN · HSE · INFORME DE CHARLA IMPARTIDA',{size:7.5,bold:1,color:'FFFFFF'});
    const tl=doc.wrap(c.t,CW-130,14,1).slice(0,2); tl.forEach((l,i)=>doc.text(M+120,y+24+i*17,l,{size:14,bold:1,color:'FFFFFF'}));
    y+=66; doc.rect(M,y,CW,3,{fill:RED}); y+=12;
    // datos
    const cat=(CATS[c.cat]||{}).n||'';
    const rows=[[['Código',c.id],['Categoría',cat],['Duración',c.min+' min']],
      [['Fecha',fmtF(R.fecha)],['Horario',[R.hora,R.horaFin].filter(Boolean).join(' a ')+(R.hora?' h':'')],['Turno',R.turno]],
      [['Área / cuadrilla',R.area],['Lugar',R.lugar||''],['Asistentes',String(R.asist.length)]],
      [['Impartida por',R.who+(R.puesto?' · '+R.puesto:'')],['Referencia',c.nom]]];
    rows.forEach(r=>{ const cw=CW/r.length; const hs=r.map(([k,v])=>doc.wrap(k+': '+(v||'—'),cw-12,8.5,0).length); const h=Math.max(...hs)*11+8;
      r.forEach(([k,v],i)=>{ const x=M+i*cw; doc.rect(x,y,cw,h,{stroke:BR}); const ls=doc.wrap(k+': '+(v||'—'),cw-12,8.5,0);
        ls.forEach((l,j)=>{ if(j===0){ doc.text(x+6,y+5,k+':',{size:8.5,bold:1,color:G}); const kw=doc.width(k+': ',8.5,1); doc.text(x+6+kw,y+5,l.slice(k.length+2),{size:8.5}); } else doc.text(x+6,y+5+j*11,l,{size:8.5}); }); });
      y+=h; });
    const refs=[]; const mp=(c.miper||[]).filter(n=>MIPER[n]); if(mp.length) refs.push(['Peligros MIPER R-12',mp.map(n=>'#'+n+' '+MIPER[n]).join(' · ')]);
    if((c.asp||[]).length) refs.push(['Aspecto ambiental R-11',c.asp.join(' · ')]);
    refs.forEach(([k,v])=>{ const ls=doc.wrap(k+': '+v,CW-12,8.5,0); const h=ls.length*11+8; doc.rect(M,y,CW,h,{stroke:BR,fill:'F8FBF8'}); ls.forEach((l,j)=>{ if(j===0){ doc.text(M+6,y+5,k+':',{size:8.5,bold:1,color:G}); doc.text(M+6+doc.width(k+': ',8.5,1),y+5,l.slice(k.length+2),{size:8.5}); } else doc.text(M+6,y+5+j*11,l,{size:8.5}); }); y+=h; });
    y+=4;
    h2('Objetivo'); para(c.obj);
    h2('Temas tratados');
    c.pts.forEach((t,i)=>{ const ls=doc.wrap(t,CW-18,9.5,0); ls.forEach((l,j)=>{ need(13); if(j===0) doc.text(M,y,(i+1)+'.',{size:9.5,bold:1,color:G2}); doc.text(M+18,y,l,{size:9.5}); y+=13; }); });
    y+=2; need(26); const ml=doc.wrap('Mensaje final: '+c.msg,CW-20,9.5,1); const mh=ml.length*13+10; doc.rect(M,y,CW,mh,{fill:'FCE6EA'}); doc.rect(M,y,4,mh,{fill:RED}); ml.forEach((l,j)=>doc.text(M+12,y+5+j*13,l,{size:9.5,bold:1})); y+=mh+2;
    if(R.coment.trim()){ h2('Comentarios y acuerdos del grupo'); para(R.coment); }
    // fotos
    if(fotosMem.length){ h2('Evidencia fotográfica');
      const gap=12, fw=(CW-gap)/2;
      for(let i=0;i<fotosMem.length;i+=2){ const pair=fotosMem.slice(i,i+2); const hs=pair.map(f=>Math.min(200,fw*f.h/f.w)); const rh=Math.max(...hs);
        need(rh+18); pair.forEach((f,j)=>{ const w=Math.min(fw,hs[j]*f.w/f.h), x=M+j*(fw+gap)+(fw-w)/2; doc.rect(M+j*(fw+gap),y,fw,rh,{fill:'F3F6F3'}); doc.image(J(f),x,y+(rh-hs[j])/2,w,hs[j]); doc.text(M+j*(fw+gap),y+rh+3,'Foto '+(i+j+1),{size:7.5,color:MU}); });
        y+=rh+16; } }
    // asistencia
    need(110); h2('Lista de asistencia ('+R.asist.length+' participante'+(R.asist.length===1?'':'s')+')');
    const cols=[22,186,70,112,CW-22-186-70-112], heads=['#','Nombre completo','No. empleado','Empresa / área','Firma'];
    const head=()=>{ let x=M; doc.rect(M,y,CW,18,{fill:G}); heads.forEach((h,i)=>{ doc.text(x+cols[i]/2,y+5,h,{size:8,bold:1,color:'FFFFFF',align:'center'}); x+=cols[i]; }); y+=18; };
    need(60); head();
    R.asist.forEach((a,i)=>{ const nl=doc.wrap(a.n,cols[1]-10,9,0).slice(0,2), el=doc.wrap(a.emp||'',cols[3]-10,8.5,0).slice(0,2); const rh=36;
      if(need(rh)) head(); let x=M;
      cols.forEach((w,k)=>{ doc.rect(x,y,w,rh,{stroke:BR,fill:i%2?'F8FBF8':undefined}); x+=w; });
      doc.text(M+cols[0]/2,y+13,String(i+1),{size:9,align:'center'});
      nl.forEach((l,j)=>doc.text(M+cols[0]+5,y+(nl.length>1?7:13)+j*11,l,{size:9}));
      doc.text(M+cols[0]+cols[1]+cols[2]/2,y+13,a.num||'',{size:8.5,align:'center'});
      el.forEach((l,j)=>doc.text(M+cols[0]+cols[1]+cols[2]+5,y+(el.length>1?8:13)+j*10,l,{size:8.5}));
      const sx=M+cols[0]+cols[1]+cols[2]+cols[3];
      if(a.sig){ const ih=rh-6, iw=Math.min(cols[4]-8,ih*a.sig.w/a.sig.h); doc.image(J(a.sig),sx+(cols[4]-iw)/2,y+3,iw,iw*a.sig.h/a.sig.w>ih?ih:iw*a.sig.h/a.sig.w); }
      else doc.text(sx+cols[4]/2,y+13,'Sin firma',{size:8,color:RED,align:'center'});
      y+=rh; });
    // firmas finales
    need(110); y+=26; const sw=(CW-30)/2;
    if(R.inst){ const ih=50, iw=Math.min(sw-20,ih*R.inst.w/R.inst.h); doc.image(J(R.inst),M+(sw-iw)/2,y,iw,Math.min(ih,iw*R.inst.h/R.inst.w)); }
    y+=54; doc.line(M+10,y,M+sw-10,y,{color:'14231A',lw:0.8}); doc.line(M+sw+30+10,y,M+CW-10,y,{color:'14231A',lw:0.8});
    doc.text(M+sw/2,y+4,R.who,{size:9,align:'center'}); doc.text(M+sw/2,y+16,'Nombre y firma de quien imparte',{size:8.5,bold:1,align:'center'});
    if(R.puesto) doc.text(M+sw/2,y+28,R.puesto,{size:8,color:MU,align:'center'});
    doc.text(M+sw+30+sw/2,y+16,'Vo. Bo. HSE',{size:8.5,bold:1,align:'center'});
    y+=44; if(sinFirma){ need(14); doc.text(M,y,`Nota: ${sinFirma} asistente${sinFirma===1?'':'s'} sin firma al momento de generar el informe.`,{size:8,color:RED}); y+=12; }
    // pie en cada página
    const gen=new Date(); const gtxt=`Generado el ${pad2(gen.getDate())}/${pad2(gen.getMonth()+1)}/${gen.getFullYear()} ${pad2(gen.getHours())}:${pad2(gen.getMinutes())} h`;
    const np=doc.pageCount; for(let i=0;i<np;i++){ doc.setPage(i); doc.line(M,doc.H-34,M+CW,doc.H-34,{color:'D5E0D7'}); doc.text(M,doc.H-28,`TMAZ · Informe de charla ${c.id} · ${fmtF(R.fecha)} · ${gtxt}`,{size:7,color:MU}); doc.text(M+CW,doc.H-28,`Página ${i+1} de ${np}`,{size:7,color:MU,align:'right'}); }
    const bytes=doc.save();
    const slug=String(c.t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
    const name=`Informe_${c.id}_${slug}_${R.fecha||today()}.pdf`;
    // guarda la lista para la próxima charla
    try{ localStorage.setItem('tmaz-charlas-lastlist',JSON.stringify(R.asist.map(a=>({n:a.n,num:a.num,emp:a.emp})))); }catch(e){}
    const blob=new Blob([bytes],{type:'application/pdf'});
    window.__lastPdf=blob;
    if(T.EMBED){ const dl=await T.DL; if(!dl){ toast('La descarga no está disponible en esta vista'); return; }
      try{ await dl.save({filename:name,data:blob}); toast('Listo: '+name); }catch(e){ toast(e&&e.code==='declined'?'Descarga cancelada':'No se pudo descargar'); } }
    else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); toast('Descargando '+name); }
  } catch(e){ console.error(e); toast('No se pudo generar el PDF: '+(e.message||e)); }
  finally{ btn.disabled=false; btn.textContent='⬇ Generar informe PDF'; }
}
})();
